<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>C.N. Nexus</title>

<style>

/* =========================================================
   VARIABLES
========================================================= */

:root{
  --bg:#05050a;
  --panel:#0b0a14;
  --panel2:#111020;
  --border:#29204d;
  --violet:#8b5cf6;
  --indigo:#4f46e5;
  --text:#f5f3ff;
  --muted:#aaa5bd;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}


/* =========================================================
   GLOBAL
========================================================= */

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:58px;
  min-height:58px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 14px;

  background:
    linear-gradient(
      90deg,
      #090812,
      #0d0b19,
      #090812
    );

  border-bottom:
    1px solid var(--border);

  box-shadow:var(--shadow);

  z-index:20;
}

.logo{
  width:36px;
  height:36px;

  flex:0 0 36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  font-size:19px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 22px
    rgba(139,92,246,.3);
}

.brand{
  min-width:0;

  display:flex;
  flex-direction:column;
}

.brand strong{
  font-size:15px;
  line-height:17px;
}

.brand span{
  color:var(--muted);
  font-size:10px;
}

.ai-button{
  margin-left:auto;

  border:
    1px solid #38266d;

  background:#120d25;

  color:#dcd1ff;

  border-radius:10px;

  padding:9px 13px;

  cursor:pointer;

  font-weight:700;
}

.ai-button:hover{
  background:#1a1234;
}


/* =========================================================
   TABS
========================================================= */

#tabs{
  height:40px;
  min-height:40px;

  display:flex;
  align-items:flex-end;

  gap:5px;

  padding:0 8px;

  background:#080711;

  border-bottom:
    1px solid var(--border);

  overflow-x:auto;
  overflow-y:hidden;
}

#tabs::-webkit-scrollbar{
  height:3px;
}

#tabs::-webkit-scrollbar-thumb{
  background:#39266d;
  border-radius:10px;
}

.tab{
  max-width:220px;
  min-width:0;

  height:34px;

  padding:0 12px;

  border:
    1px solid transparent;

  border-radius:
    10px 10px 0 0;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  flex-shrink:0;
}

.tab.active{
  background:var(--panel);

  border-color:
    var(--border);

  border-bottom-color:
    var(--panel);

  color:var(--text);
}

@media(max-width:760px){

  .tab{
    max-width:170px;
  }

}

@media(max-width:430px){

  .tab{
    max-width:125px;
  }

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  height:52px;
  min-height:52px;

  display:flex;
  align-items:center;

  gap:7px;

  padding:7px 10px;

  background:var(--panel);

  border-bottom:
    1px solid var(--border);
}

.tool{
  width:35px;
  height:35px;

  flex:0 0 35px;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:#0d0b18;

  color:var(--text);

  cursor:pointer;

  font-size:16px;
}

.tool:hover{
  background:#171329;
}

.address-wrap{
  min-width:0;
  flex:1;

  height:35px;

  display:flex;
  align-items:center;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:#080711;

  overflow:hidden;
}

.address{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  padding:0 13px;

  font-size:13px;
}

.address::placeholder{
  color:#77718d;
}


/* =========================================================
   LAYOUT
========================================================= */

.layout{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:
    230px 1fr;
}

.sidebar{
  min-width:0;

  background:#080711;

  border-right:
    1px solid var(--border);

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.sidebar-title{
  padding:
    15px 14px 10px;

  font-size:12px;

  font-weight:800;

  color:#d7d0e8;
}

#favorites{
  overflow:auto;

  padding:
    0 8px 12px;
}

.favorite{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:10px;

  border-radius:9px;

  cursor:pointer;

  text-align:left;

  font-size:12px;
}

.favorite:hover{
  background:#121021;
  color:var(--text);
}

.favorite-name{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.empty-favorites{
  padding:10px;

  color:#68627a;

  font-size:11px;
}

.main{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  position:relative;
}

#page{
  flex:1;
  min-height:0;

  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(79,70,229,.09),
      transparent 42%
    ),
    var(--bg);
}

#status{
  height:25px;
  min-height:25px;

  display:flex;
  align-items:center;

  padding:0 10px;

  border-top:
    1px solid var(--border);

  background:#080711;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   HOME
========================================================= */

.home{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;
}

.home-card{
  width:min(700px,100%);

  text-align:center;

  padding:30px;
}

.home-logo{
  width:70px;
  height:70px;

  margin:
    0 auto 18px;

  border-radius:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 45px
    rgba(139,92,246,.28);
}

.home h1{
  margin:
    0 0 8px;

  font-size:29px;
}

.home p{
  margin:0;

  color:var(--muted);

  font-size:13px;
}

.home-search{
  margin:
    24px auto 0;

  display:flex;

  max-width:560px;

  gap:8px;
}

.home-search input{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 13px;
}

.primary{
  height:42px;

  border:
    1px solid #5533a1;

  border-radius:11px;

  padding:
    0 17px;

  background:
    linear-gradient(
      135deg,
      #6538bf,
      #4036c7
    );

  color:white;

  font-weight:800;

  cursor:pointer;
}

.primary:hover{
  filter:brightness(1.1);
}


/* =========================================================
   IFRAME
========================================================= */

.browser-frame{
  width:100%;
  height:100%;

  display:block;

  border:0;

  background:white;
}


/* =========================================================
   NEXUS ERROR / FALLBACK
========================================================= */

.external-fallback{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #080711,
      #05050a
    );

  z-index:10;

  padding:25px;
}

.external-fallback-box{
  width:min(
    520px,
    100%
  );

  background:#0d0b18;

  border:
    1px solid #38266d;

  border-radius:18px;

  padding:28px;

  text-align:center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);
}

.external-fallback-title{
  font-size:18px;

  font-weight:800;

  line-height:1.35;

  margin-bottom:12px;
}

.external-fallback-text{
  color:var(--muted);

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;
}

.external-fallback-url{
  color:#c9b9ff;

  font-size:12px;

  margin-bottom:20px;

  word-break:break-word;
}

.external-fallback-button{
  width:100%;
}


/* =========================================================
   AI PANEL
========================================================= */

.ai-panel{
  position:absolute;

  right:15px;
  bottom:42px;

  width:min(
    360px,
    calc(100% - 30px)
  );

  max-height:500px;

  display:none;
  flex-direction:column;

  background:#0b0a14;

  border:
    1px solid #39266d;

  border-radius:16px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.6);

  overflow:hidden;

  z-index:30;
}

.ai-panel.open{
  display:flex;
}

.ai-head{
  padding:
    13px 15px;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.ai-head strong{
  font-size:13px;
}

.ai-close{
  border:0;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:17px;
}

.ai-messages{
  flex:1;

  min-height:180px;

  max-height:330px;

  overflow:auto;

  padding:12px;
}

.ai-message{
  padding:
    9px 11px;

  margin-bottom:8px;

  border-radius:10px;

  font-size:12px;

  line-height:1.45;
}

.ai-message.bot{
  background:#111020;

  color:#ddd7ed;
}

.ai-message.user{
  background:#211642;

  color:#eee8ff;

  margin-left:25px;
}

.ai-form{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid var(--border);
}

.ai-input{
  flex:1;

  min-width:0;

  height:36px;

  border:
    1px solid var(--border);

  border-radius:9px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 10px;

  font-size:12px;
}

.ai-send{
  width:38px;
  height:36px;

  border:
    1px solid #5533a1;

  border-radius:9px;

  background:#34236c;

  color:white;

  cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  header{
    padding:
      0 9px;
  }

  .brand span{
    display:none;
  }

  .brand strong{
    font-size:14px;
  }

  .ai-button{
    padding:
      8px 10px;

    font-size:11px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .toolbar{
    gap:5px;

    padding:7px;
  }

  .tool{
    width:33px;

    flex-basis:33px;
  }

  .address{
    font-size:12px;
  }

  .home{
    padding:15px;
  }

  .home-card{
    padding:
      20px 10px;
  }

  .home h1{
    font-size:24px;
  }

  .home-search{
    flex-direction:column;
  }

  .primary{
    width:100%;
  }

  .ai-panel{
    right:10px;

    bottom:34px;
  }

}

</style>

</head>

    </div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const STORAGE_KEY =
  "cn_nexus_bookmarks_v1";

const IFRAME_FALLBACK_DELAY =
  5000;


/* =========================================================
   ÉTAT
========================================================= */

let tabs = [
  {
    id:1,
    title:"Nouvel onglet",
    url:""
  }
];

let activeTab = 1;

let history = [];

let historyIndex = -1;

let iframeFallbackTimer = null;


/* =========================================================
   ÉLÉMENTS
========================================================= */

const $ =
  id =>
    document.getElementById(id);

const page =
  $("page");

const address =
  $("address");

const statusEl =
  $("status");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  statusEl.textContent =
    text;

}


/* =========================================================
   RÉCUPÉRER LE NOM DU SITE
========================================================= */

function getSiteName(url){

  try{

    const parsed =
      new URL(url);

    let host =
      parsed.hostname;

    if(
      host.startsWith("www.")
    ){

      host =
        host.slice(4);

    }

    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }

    /*
      Première lettre en majuscule
      pour obtenir par exemple :

      google.com
      → Google.com
    */

    if(host.length > 0){

      host =
        host.charAt(0).toUpperCase() +
        host.slice(1);

    }

    return host;

  }catch{

    return "Ce site";

  }

}


/* =========================================================
   URL VISUELLE .NEXUS
========================================================= */

function displayUrl(url){

  if(!url){
    return "";
  }

  try{

    const parsed =
      new URL(url);

    let host =
      parsed.hostname;

    if(
      host.startsWith("www.")
    ){

      host =
        host.slice(4);

    }

    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }

    return (
      host +
      ".nexus" +
      parsed.pathname +
      parsed.search +
      parsed.hash
    );

  }catch{

    return url;

  }

}


/* =========================================================
   NOM D'ONGLET
========================================================= */

function tabLabel(url){

  if(!url){
    return "Nouvel onglet";
  }

  try{

    const parsed =
      new URL(url);

    let host =
      parsed.hostname;

    if(
      host.startsWith("www.")
    ){

      host =
        host.slice(4);

    }

    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }

    return host + ".nexus";

  }catch{

    return "C.N. Nexus";

  }

}


/* =========================================================
   NORMALISATION
========================================================= */

function normalize(value){

  value =
    String(value || "")
      .trim();

  if(!value){
    return "";
  }


  /*
    Retire le faux .nexus
    si l'utilisateur le tape.
  */

  if(
    !value.includes("://") &&
    /\.nexus(?=[:/?#]|$)/i.test(value)
  ){

    value =
      value.replace(
        /\.nexus(?=[:/?#]|$)/i,
        ""
      );

  }


  /*
    URL avec protocole
  */

  if(
    value.includes("://")
  ){

    try{

      const parsed =
        new URL(value);

      if(
        parsed.hostname.endsWith(".nexus")
      ){

        parsed.hostname =
          parsed.hostname.slice(
            0,
            -6
          );

      }

      return parsed.toString();

    }catch{

      return value;

    }

  }


  /*
    Domaine classique
  */

  if(
    /^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/.*)?$/i
      .test(value)
  ){

    return (
      "https://" +
      value
    );

  }


  /*
    Recherche
  */

  return (
    "https://www.google.com/search?q=" +
    encodeURIComponent(value)
  );

}


/* =========================================================
   ONGLET ACTUEL
========================================================= */

function getActiveTab(){

  return tabs.find(
    t =>
      t.id === activeTab
  );

}


/* =========================================================
   AFFICHER LES ONGLETS
========================================================= */

function renderTabs(){

  const container =
    $("tabs");

  container.innerHTML =
    "";


  tabs.forEach(
    t => {

      const button =
        document.createElement(
          "button"
        );

      button.className =
        "tab" +
        (
          t.id === activeTab
            ? " active"
            : ""
        );


      button.textContent =
        tabLabel(t.url);


      button.title =
        t.url
          ? displayUrl(t.url)
          : "Nouvel onglet";


      button.onclick =
        () => {

          activeTab =
            t.id;

          renderTabs();

          loadCurrent();

        };


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   ACCUEIL
========================================================= */

function showHome(){

  page.innerHTML = `

    <div class="home">

      <div class="home-card">

        <div class="home-logo">
          N
        </div>

        <h1>
          C.N. Nexus
        </h1>

        <p>
          Le navigateur de C.N. Organization
        </p>

        <div class="home-search">

          <input
            id="homeInput"
            type="text"
            placeholder="Rechercher ou entrer une adresse"
            autocomplete="off"
            spellcheck="false"
          >

          <button
            class="primary"
            id="homeGo"
          >
            Explorer
          </button>

        </div>

      </div>

    </div>

  `;


  const input =
    $("homeInput");

  const go =
    $("homeGo");


  function launch(){

    navigate(
      input.value
    );

  }


  go.onclick =
    launch;


  input.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        launch();

      }

    }
  );

}


/* =========================================================
   NETTOYER LE FALLBACK
========================================================= */

function clearIframeFallback(){

  if(
    iframeFallbackTimer
  ){

    clearTimeout(
      iframeFallbackTimer
    );

    iframeFallbackTimer =
      null;

  }

}


/* =========================================================
   FALLBACK NEXUS
========================================================= */

function openExternal(url){

  /*
    Nom réel du site :
    Google.com
    Chatgpt.com
    Github.com
    etc.
  */

  const siteName =
    getSiteName(url);


  const overlay =
    document.createElement(
      "div"
    );

  overlay.className =
    "external-fallback";


  const box =
    document.createElement(
      "div"
    );

  box.className =
    "external-fallback-box";


  const title =
    document.createElement(
      "div"
    );

  title.className =
    "external-fallback-title";


  title.textContent =
    siteName +
    " utilise un protocole incompatible avec le système sécurisé Nexus.";


  const text =
    document.createElement(
      "div"
    );

  text.className =
    "external-fallback-text";


  text.textContent =
    "Ouvrir avec votre navigateur par défaut.";


  const urlText =
    document.createElement(
      "div"
    );

  urlText.className =
    "external-fallback-url";


  urlText.textContent =
    displayUrl(url);


  const button =
    document.createElement(
      "button"
    );

  button.className =
    "primary external-fallback-button";


  button.textContent =
    "↗ Ouvrir avec votre navigateur par défaut";


  button.onclick =
    () => {

      /*
        IMPORTANT :
        L'ouverture est directement déclenchée
        par le clic de l'utilisateur afin que
        Safari/iOS ne bloque pas le nouvel onglet.
      */

      const opened =
        window.open(
          url,
          "_blank"
        );


      if(opened){

        overlay.remove();

        setStatus(
          "Ouvert avec le navigateur par défaut — " +
          displayUrl(url)
        );

      }else{

        setStatus(
          "L'ouverture a été bloquée par le navigateur."
        );

      }

    };


  box.append(
    title,
    text,
    urlText,
    button
  );


  overlay.appendChild(
    box
  );


  page.appendChild(
    overlay
  );

}


/* =========================================================
   FALLBACK IFRAME
========================================================= */

function setupIframeFallback(
  frame,
  url
){

  clearIframeFallback();


  /*
    NE PAS considérer "load" comme une preuve
    que la page est réellement visible.

    Certains sites déclenchent load même lorsque
    l'affichage dans une iframe est refusé.
  */

  frame.addEventListener(
    "load",
    () => {

      /*
        On indique seulement que l'iframe
        a terminé son chargement technique.

        On n'écrit PAS :
        "Page chargée"
      */

      setStatus(
        "Connexion au site — " +
        displayUrl(url)
      );

    },
    {
      once:true
    }
  );


  /*
    Après le délai, Nexus affiche son écran
    de compatibilité.

    L'utilisateur peut alors décider d'ouvrir
    le site avec Safari.

    Cette méthode est volontairement utilisée
    car JavaScript ne peut pas lire librement
    le contenu d'une iframe provenant d'un autre
    domaine pour savoir si X-Frame-Options/CSP
    a réellement bloqué l'affichage.
  */

  iframeFallbackTimer =
    setTimeout(
      () => {

        iframeFallbackTimer =
          null;


        setStatus(
          "Problème d'affichage — " +
          displayUrl(url)
        );


        openExternal(
          url
        );

      },
      IFRAME_FALLBACK_DELAY
    );

}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(
  value,
  push = true
){

  const url =
    normalize(value);


  if(!url){

    showHome();

    return;

  }


  const t =
    getActiveTab();


  if(!t){
    return;
  }


  /*
    URL réelle
  */

  t.url =
    url;


  try{

    const parsed =
      new URL(url);

    t.title =
      parsed.hostname;

  }catch{

    t.title =
      "C.N. Nexus";

  }


  /*
    URL visuelle
  */

  address.value =
    displayUrl(url);


  renderTabs();


  /*
    Historique
  */

  if(push){

    history =
      history.slice(
        0,
        historyIndex + 1
      );

    history.push(
      url
    );

    historyIndex =
      history.length - 1;

  }


  clearIframeFallback();


  page.innerHTML =
    "";


  const frame =
    document.createElement(
      "iframe"
    );


  frame.className =
    "browser-frame";


  frame.setAttribute(
    "allowfullscreen",
    ""
  );


  frame.setAttribute(
    "referrerpolicy",
    "no-referrer-when-downgrade"
  );


  /*
    IMPORTANT :
    URL RÉELLE uniquement.
    Le .nexus est seulement visuel.
  */

  frame.src =
    url;


  page.appendChild(
    frame
  );


  setStatus(
    "Connexion à " +
    displayUrl(url)
  );


  setupIframeFallback(
    frame,
    url
  );


  updateBookmarkButton();

}


/* =========================================================
   CHARGER L'ONGLET
========================================================= */

function loadCurrent(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    clearIframeFallback();

    page.innerHTML =
      "";

    address.value =
      "";

    showHome();

    setStatus(
      "Prêt"
    );

    updateBookmarkButton();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   NOUVEL ONGLET
========================================================= */

function newTab(){

  const id =
    Date.now();


  tabs.push({
    id:id,
    title:"Nouvel onglet",
    url:""
  });


  activeTab =
    id;


  renderTabs();

  loadCurrent();

  address.focus();

}


/* =========================================================
   ACCUEIL
========================================================= */

function goHome(){

  const t =
    getActiveTab();


  if(!t){
    return;
  }


  t.url =
    "";

  t.title =
    "Nouvel onglet";


  clearIframeFallback();


  renderTabs();

  loadCurrent();

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    loadCurrent();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

  if(
    historyIndex <= 0
  ){

    setStatus(
      "Pas de page précédente"
    );

    return;

  }


  historyIndex--;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FORWARD
========================================================= */

function goForward(){

  if(
    historyIndex >=
    history.length - 1
  ){

    setStatus(
      "Pas de page suivante"
    );

    return;

  }


  historyIndex++;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FAVORIS
========================================================= */

function getBookmarks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveBookmarks(
  bookmarks
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(bookmarks)
  );

}


/* =========================================================
   AFFICHER FAVORIS
========================================================= */

function renderFavorites(){

  const container =
    $("favorites");


  const bookmarks =
    getBookmarks();


  container.innerHTML =
    "";


  if(
    bookmarks.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-favorites";


    empty.textContent =
      "Aucun favori";


    container.appendChild(
      empty
    );


    return;

  }


  bookmarks.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "favorite";


      const icon =
        document.createElement(
          "span"
        );


      icon.textContent =
        "★";


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "favorite-name";


      name.textContent =
        item.title ||
        tabLabel(item.url);


      button.title =
        displayUrl(item.url);


      button.append(
        icon,
        name
      );


      button.onclick =
        () => {

          navigate(
            item.url
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   FAVORI
========================================================= */

function toggleBookmark(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    setStatus(
      "Aucune page à ajouter aux favoris"
    );

    return;

  }


  const bookmarks =
    getBookmarks();


  const existing =
    bookmarks.findIndex(
      item =>
        item.url === t.url
    );


  if(
    existing !== -1
  ){

    bookmarks.splice(
      existing,
      1
    );


    saveBookmarks(
      bookmarks
    );


    renderFavorites();


    setStatus(
      "Favori supprimé"
    );


    $("bookmark").textContent =
      "☆";


    return;

  }


  bookmarks.push({
    title:
      tabLabel(t.url),

    url:
      t.url
  });


  saveBookmarks(
    bookmarks
  );


  renderFavorites();


  setStatus(
    "Ajouté aux favoris — " +
    displayUrl(t.url)
  );


  $("bookmark").textContent =
    "★";

}


/* =========================================================
   ÉTAT FAVORI
========================================================= */

function updateBookmarkButton(){

  const t =
    getActiveTab();


  const button =
    $("bookmark");


  if(
    !t ||
    !t.url
  ){

    button.textContent =
      "☆";

    return;

  }


  const bookmarks =
    getBookmarks();


  const exists =
    bookmarks.some(
      item =>
        item.url === t.url
    );


  button.textContent =
    exists
      ? "★"
      : "☆";

}


/* =========================================================
   C.N. AI
========================================================= */

function aiReply(message){

  const text =
    message
      .toLowerCase()
      .trim();


  if(
    text.includes("iframe")
  ){

    return (
      "Lorsqu'un site ne peut pas être affiché " +
      "dans le système sécurisé de Nexus, " +
      "Nexus propose de l'ouvrir avec le navigateur par défaut."
    );

  }


  if(
    text.includes("url")
  ){

    return (
      "Le .nexus affiché dans la barre est uniquement visuel. " +
      "L'adresse réelle utilisée par Nexus reste inchangée."
    );

  }


  if(
    text.includes("sécur")
  ){

    return (
      "Le système sécurisé Nexus contrôle l'affichage " +
      "des pages externes dans son environnement. " +
      "Le .nexus lui-même est uniquement visuel."
    );

  }


  if(
    text.includes("nouvel onglet")
  ){

    return (
      "Le bouton + permet de créer un nouvel onglet."
    );

  }


  if(
    text.includes("favori")
  ){

    return (
      "Le bouton ☆ permet d'ajouter la page actuelle aux favoris."
    );

  }


  if(
    text.includes("bonjour") ||
    text.includes("salut") ||
    text === "yo"
  ){

    return (
      "Salut 👋 Comment puis-je t'aider avec C.N. Nexus ?"
    );

  }


  return (
    "Je suis C.N. AI. Je peux t'aider avec " +
    "les fonctions de C.N. Nexus : navigation, " +
    "onglets, favoris, affichage des pages et ouverture externe."
  );

}


/* =========================================================
   MESSAGE AI
========================================================= */

function addAiMessage(
  text,
  type
){

  const container =
    $("aiMessages");


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "ai-message " +
    type;


  message.textContent =
    text;


  container.appendChild(
    message
  );


  container.scrollTop =
    container.scrollHeight;

}


/* =========================================================
   ÉVÉNEMENTS
========================================================= */

$("back").onclick =
  goBack;


$("forward").onclick =
  goForward;


$("reload").onclick =
  reload;


$("home").onclick =
  goHome;


$("newTab").onclick =
  newTab;


$("bookmark").onclick =
  toggleBookmark;


/* =========================================================
   BARRE D'ADRESSE
========================================================= */

address.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      navigate(
        address.value
      );

    }

  }
);


/* =========================================================
   AI OUVRIR
========================================================= */

$("aiOpen").onclick =
  () => {

    $("aiPanel")
      .classList
      .toggle("open");

  };


$("aiClose").onclick =
  () => {

    $("aiPanel")
      .classList
      .remove("open");

  };


/* =========================================================
   AI FORM
========================================================= */

$("aiForm").addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const input =
      $("aiInput");


    const value =
      input.value.trim();


    if(!value){
      return;
    }


    addAiMessage(
      value,
      "user"
    );


    input.value =
      "";


    setTimeout(
      () => {

        addAiMessage(
          aiReply(value),
          "bot"
        );

      },
      250
    );

  }
);


/* =========================================================
   INITIALISATION
========================================================= */

renderTabs();

renderFavorites();

showHome();

updateBookmarkButton();

setStatus(
  "Prêt"
);

</script>
