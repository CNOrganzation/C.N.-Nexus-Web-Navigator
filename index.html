<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080611">
<title>C.N. Nexus</title>

<style>

:root{
  --bg:#05050a;
  --panel:#0b0a14;
  --panel2:#111020;
  --border:#29204d;
  --violet:#8b5cf6;
  --indigo:#4f46e5;
  --marine:#07152f;
  --text:#f5f3ff;
  --muted:#aaa5bd;
  --danger:#ff5577;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(91,50,180,.18),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(28,55,120,.2),
      transparent 35%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.topbar{
  background:rgba(8,7,15,.94);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(16px);
  padding:10px 12px 0;
}

.brand-row{
  display:flex;
  align-items:center;
  gap:10px;
  height:42px;
}

.logo{
  width:34px;
  height:34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-weight:900;
  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );
  box-shadow:
    0 0 22px rgba(139,92,246,.28);
}

.brand{
  font-weight:800;
  letter-spacing:.2px;
}

.brand small{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:500;
}

.spacer{
  flex:1;
}

.icon-btn,
.nav-btn,
.home-btn{
  border:1px solid transparent;
  background:transparent;
  color:var(--muted);
  width:36px;
  height:34px;
  border-radius:9px;
}

.icon-btn:hover,
.nav-btn:hover,
.home-btn:hover{
  background:#17132a;
  color:white;
  border-color:var(--border);
}

.ai-btn{
  border:1px solid #6040b8;
  background:
    linear-gradient(
      135deg,
      #201445,
      #111534
    );
  color:#dcd1ff;
  border-radius:9px;
  padding:8px 11px;
  font-weight:800;
  font-size:12px;
}

.tabs{
  display:flex;
  gap:4px;
  overflow-x:auto;
  overflow-y:hidden;
  padding-top:8px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{

}

.tab{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 14px;
  border-bottom:2px solid transparent;
  white-space:nowrap;

  /*
    Empêche les noms d'onglets

  */
  max-width:220px;
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;

}

.tab.active{
  color:#fff;

}

.toolbar{

  gap:7px;
  padding:9px 0;
}

.address-wrap{
  flex:1;
  display:flex;
  align-items:center;
  gap:8px;

  border:1px solid var(--border);

.address-wrap span{

}

#address{

}

.main{
  flex:1;

}

.page-area{

.page{

<script>


/* ================================
   CONFIGURATION
================================ */

const STORAGE_KEY=
  "cn_nexus_bookmarks_v1";


/*
  Temps d'attente avant le fallback
  vers un nouvel onglet.
*/
const IFRAME_FALLBACK_DELAY=
  5000;



/* ================================
   ÉTAT
================================ */

let tabs=[
  {
    id:1,
    title:"Nouvel onglet",
    url:""
  }
];


let activeTab=1;


let history=[];


let historyIndex=-1;


/*
  Timer du fallback iframe.
*/
let iframeFallbackTimer=null;


/*
  Indique qu'un chargement iframe
  a été détecté.
*/
let iframeLoadDetected=false;



/* ================================
   ÉLÉMENTS
================================ */

const $=
  id=>document.getElementById(id);


const page=
  $("page");


const address=
  $("address");


const statusEl=
  $("status");



/* ================================
   ONGLET ACTUEL
================================ */

function currentTab(){

  return tabs.find(
    t=>t.id===activeTab
  );

}



/* ================================
   AFFICHAGE DE L'URL
================================ */

/*
  L'URL réelle n'est JAMAIS modifiée.

  Exemple réel :

  https://www.google.com/search?q=test

  Affichage Nexus :

  google.com.nexus/search?q=test

  .nexus est donc uniquement visuel.
*/

function displayUrl(url){

  if(!url){

    return "";

  }


  try{

    const parsed=
      new URL(url);


    /*
      On retire www. uniquement
      pour rendre l'affichage plus court.
    */
    let host=
      parsed.hostname
        .replace(/^www\./i,"");


    /*
      Si jamais une fausse extension
      était déjà présente, on l'enlève.
    */
    host=
      host.replace(
        /\.nexus$/i,
        ""
      );


    /*
      Faux suffixe uniquement
      dans l'affichage.
    */
    host+=".nexus";


    return (
      host+
      parsed.pathname+
      parsed.search+
      parsed.hash
    );

  }catch{

    let fallback=
      String(url)
        .replace(
          /\.nexus$/i,
          ""
        );


    return fallback+".nexus";

  }

}



/* ================================
   NOM COURT DES ONGLET
================================ */

/*
  Les onglets n'affichent PAS
  toute l'URL.

  Exemple :

  google.com.nexus/search/...
  
  devient simplement :

  google.com.nexus

  Cela évite les onglets de 3 km.
*/

function tabLabel(url){

  if(!url){

    return "Nouvel onglet";

  }


  try{

    const parsed=
      new URL(url);


    let host=
      parsed.hostname
        .replace(/^www\./i,"")
        .replace(/\.nexus$/i,"");


    return host+".nexus";

  }catch{

    return "Page";

  }

}



/* ================================
   AFFICHAGE DES ONGLET
================================ */

function renderTabs(){

  $("tabs").innerHTML="";


  tabs.forEach(t=>{


    const b=
      document.createElement(
        "button"
      );


    b.className=
      "tab"+
      (
        t.id===activeTab
          ? " active"
          : ""
      );


    /*
      Nom court dans l'onglet.
    */
    b.textContent=
      t.url
        ? tabLabel(t.url)
        : "Nouvel onglet";


    /*
      Au survol, on peut voir
      l'adresse .nexus complète.
    */
    b.title=
      t.url
        ? displayUrl(t.url)
        : "Nouvel onglet";


    b.onclick=()=>{

      activeTab=t.id;

      renderTabs();

      loadCurrent();

    };


    $("tabs")
      .appendChild(b);

  });

}



/* ================================
   STATUT
================================ */

function setStatus(s){

  statusEl.textContent=s;

}



/* ================================
   PAGE D'ACCUEIL
================================ */

function homePage(){

  clearIframeFallback();


  page.innerHTML=`

    <div class="home">

      <div class="home-card">

        <h1>

          <span class="gradient">
            C.N. Nexus
          </span>

        </h1>


        <p>
          Un espace de navigation conçu
          par C.N. Organization.
        </p>


        <form
          class="search-home"
          id="homeSearch"
        >

          <input
            id="homeInput"
            placeholder="Rechercher sur le Web…"
          >


          <button class="primary">
            Rechercher
          </button>

        </form>


        <div class="quick">


          <button
            data-url="https://www.google.com"
          >
            Google
          </button>


          <button
            data-url="https://www.youtube.com"
          >
            YouTube
          </button>


          <button
            data-url="https://github.com"
          >
            GitHub
          </button>


        </div>


      </div>

    </div>

  `;


  $("homeSearch").onsubmit=e=>{

    e.preventDefault();


    navigate(
      $("homeInput").value
    );

  };


  page
    .querySelectorAll("[data-url]")
    .forEach(b=>{

      b.onclick=()=>{

        navigate(
          b.dataset.url
        );

      };

    });

}



/* ================================
   NORMALISATION DES URL
================================ */

/*
  Convertit ce que l'utilisateur
  écrit en vraie URL.

  Exemple :

  google.com.nexus
  ↓
  https://google.com

  google.com.nexus/test
  ↓
  https://google.com/test

  https://google.com.nexus/test
  ↓
  https://google.com/test
*/

function normalize(value){

  value=value.trim();


  if(!value){

    return "";

  }


  let cleaned=value;


  /*
    Si ce n'est pas une URL avec
    protocole, on traite le domaine.
  */
  if(
    !/^https?:\/\//i.test(cleaned)
  ){


    const match=
      cleaned.match(
        /^([^\/?#]+)([\/?#].*)?$/i
      );


    if(
      match &&
      /\.nexus$/i.test(match[1])
    ){


      /*
        Suppression du faux .nexus
        uniquement sur le domaine.
      */
      cleaned=
        match[1]
          .replace(
            /\.nexus$/i,
            ""
          )+
        (
          match[2]||
          ""
        );

    }

  }else{


    /*
      Cas :

      https://google.com.nexus/test
    */

    try{

      const parsed=
        new URL(cleaned);


      parsed.hostname=
        parsed.hostname
          .replace(
            /\.nexus$/i,
            ""
          );


      cleaned=
        parsed.href;

    }catch{

      /*
        Si l'URL est invalide,
        on la laisse telle quelle.
      */

    }

  }


  /*
    URL avec protocole.
  */
  if(
    /^https?:\/\//i.test(cleaned)
  ){

    return cleaned;

  }


  /*
    Domaine classique.
  */
  if(
    /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i.test(cleaned)
  ){

    return "https://"+cleaned;

  }


  /*
    Sinon on considère que c'est
    une recherche.
  */
  return (
    "https://www.google.com/search?q="+
    encodeURIComponent(value)
  );

}



/* ================================
   FALLBACK IFRAME
================================ */

function clearIframeFallback(){

  if(iframeFallbackTimer){

    clearTimeout(
      iframeFallbackTimer
    );


    iframeFallbackTimer=null;

  }

}



/* ================================
   OUVERTURE EXTERNE
================================ */

function openExternal(url){

  const opened=
    window.open(
      url,
      "_blank",
      "noopener,noreferrer"
    );


  if(!opened){

    setStatus(
      "Impossible d'ouvrir le nouvel onglet automatiquement."
    );

  }

}



/* ================================
   DÉTECTION IFRAME
================================ */

/*
  Système demandé :

  1. On essaie d'abord l'iframe.
  2. Si elle charge :
       → on reste dans Nexus.
  3. Si aucun chargement n'est
     détecté après 5 secondes :
       → nouvel onglet.

  IMPORTANT :
  Les protections des sites externes
  (X-Frame-Options / CSP) ne permettent
  pas à une page comme Nexus de savoir
  parfaitement pourquoi un iframe
  ne s'affiche pas.

  Ce système est donc un fallback
  basé sur le délai de chargement.
*/

function setupIframeFallback(
  frame,
  url
){

  clearIframeFallback();


  iframeLoadDetected=false;


  /*
    Si l'iframe signale un chargement,
    on considère qu'elle fonctionne.
  */
  frame.addEventListener(
    "load",
    ()=>{


      iframeLoadDetected=true;


      clearIframeFallback();


      setStatus(
        "Page chargée — "+
        displayUrl(url)
      );


    },
    {
      once:true
    }
  );


  /*
    Après 5 secondes :
    si aucun load n'a été détecté,
    on tente le nouvel onglet.
  */
  iframeFallbackTimer=
    setTimeout(
      ()=>{


        iframeFallbackTimer=null;


        /*
          L'iframe a chargé :
          on ne fait RIEN.
        */
        if(iframeLoadDetected){

          return;

        }


        setStatus(
          "Cette page ne peut pas être affichée ici — ouverture dans un nouvel onglet…"
        );


        openExternal(url);


      },
      IFRAME_FALLBACK_DELAY
    );

}



/* ================================
   NAVIGATION
================================ */

function navigate(
  value,
  push=true
){

  const url=
    normalize(value);


  if(!url){

    homePage();

    address.value="";

    return;

  }


  clearIframeFallback();


  const t=
    currentTab();


  /*
    IMPORTANT :
    t.url contient toujours
    la vraie URL.
  */
  t.url=url;


  try{

    t.title=
      new URL(url)
        .hostname
        .replace(
          /^www\./,
          ""
        );

  }catch{

    t.title="Page";

  }


  /*
    La barre affiche la fausse
    version .nexus.
  */
  address.value=
    displayUrl(url);


  renderTabs();


  /*
    Historique avec les VRAIES URLs.
  */
  if(push){

    history=
      history.slice(
        0,
        historyIndex+1
      );


    history.push(url);


    historyIndex++;

  }


  /*
    Nettoyage de la page précédente.
  */
  page.innerHTML="";


  /*
    Création de l'iframe.
  */
  const frame=
    document.createElement(
      "iframe"
    );


  frame.className="frame";


  /*
    IMPORTANT :
    l'iframe reçoit l'URL réelle,
    PAS l'URL .nexus.
  */
  frame.src=url;


  frame.referrerPolicy=
    "no-referrer-when-downgrade";


  /*
    Sécurité iframe.
  */
  frame.setAttribute(
    "allowfullscreen",
    ""
  );


  page.appendChild(frame);


  setStatus(
    "Chargement : "+
    displayUrl(url)
  );


  /*
    Active le fallback.
  */
  setupIframeFallback(
    frame,
    url
  );

}



/* ================================
   CHARGEMENT ONGLET ACTUEL
================================ */

function loadCurrent(){

  clearIframeFallback();


  const t=
    currentTab();


  if(!t.url){

    homePage();

    address.value="";

    setStatus("Prêt");

    return;

  }


  /*
    On passe l'URL réelle.
  */
  navigate(
    t.url,
    false
  );

}



/* ================================
   NOUVEL ONGLET
================================ */

function newTab(){

  clearIframeFallback();


  const id=
    Date.now();


  tabs.push({

    id:id,

    title:"Nouvel onglet",

    url:""

  });


  activeTab=id;


  renderTabs();


  loadCurrent();

}



/* ================================
   BARRE D'ADRESSE
================================ */

$("address")
  .addEventListener(
    "keydown",
    e=>{


      if(e.key==="Enter"){

        navigate(
          address.value
        );

      }

    }
  );



/* ================================
   ACCUEIL
================================ */

$("home").onclick=()=>{

  clearIframeFallback();


  const t=
    currentTab();


  t.url="";


  t.title=
    "Nouvel onglet";


  renderTabs();


  loadCurrent();

};



/* ================================
   RECHARGER
================================ */

$("reload").onclick=()=>{

  clearIframeFallback();


  loadCurrent();

};



/* ================================
   RETOUR
================================ */

$("back").onclick=()=>{

  clearIframeFallback();


  if(historyIndex>0){

    historyIndex--;


    navigate(
      history[historyIndex],
      false
    );

  }

};



/* ================================
   AVANCE
================================ */

$("forward").onclick=()=>{

  clearIframeFallback();


  if(
    historyIndex<
    history.length-1
  ){

    historyIndex++;


    navigate(
      history[historyIndex],
      false
    );

  }

};



/* ================================
   NOUVEL ONGLET
================================ */

$("newTab").onclick=
  newTab;



/* ================================
   FAVORIS
================================ */

$("bookmark").onclick=()=>{


  const url=
    currentTab().url;


  if(!url){

    return;

  }


  const list=
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )||
      "[]"
    );


  /*
    Pas de doublon.
  */
  if(
    !list.some(
      x=>x.url===url
    )
  ){


    /*
      On sauvegarde la VRAIE URL.
    */
    list.push({

      title:
        currentTab().title,

      url:url

    });


    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(list)
    );


    renderBookmarks();


    setStatus(
      "Ajouté aux favoris — "+
      displayUrl(url)
    );

  }

};



/* ================================
   AFFICHAGE FAVORIS
================================ */

function renderBookmarks(){

  const box=
    $("bookmarks");


  const list=
    JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      )||
      "[]"
    );


  box.innerHTML="";


  if(!list.length){

    box.innerHTML=
      '<div class="empty">Aucun favori pour le moment.</div>';

    return;

  }


  list.forEach(
    (item,i)=>{


      const row=
        document.createElement(
          "div"
        );


      row.className=
        "bookmark";


      const btn=
        document.createElement(
          "button"
        );


      btn.className=
        "bookmark";


      btn.style.border="0";


      btn.style.background=
        "transparent";


      btn.style.color=
        "inherit";


      btn.style.padding="0";


      btn.style.flex="1";


      /*
        Affichage .nexus.
        item.url reste réelle.
      */
      btn.innerHTML=
        `<span>
          ☆ ${escapeHtml(
            displayUrl(item.url)
          )}
        </span>`;


      btn.title=
        displayUrl(item.url);


      btn.onclick=()=>{

        navigate(
          item.url
        );

      };


      const del=
        document.createElement(
          "button"
        );


      del.className="remove";


      del.textContent="×";


      del.title=
        "Supprimer";


      del.onclick=()=>{


        list.splice(
          i,
          1
        );


        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(list)
        );


        renderBookmarks();

      };


      row.append(
        btn,
        del
      );


      box.appendChild(row);

    }
  );

}



/* ================================
   SÉCURITÉ HTML
================================ */

function escapeHtml(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"

    }[m])
  );

}



/* ================================
   C.N. AI
================================ */

$("aiOpen").onclick=()=>{

  $("aiPanel")
    .classList
    .add("open");

};


$("aiClose").onclick=()=>{

  $("aiPanel")
    .classList
    .remove("open");

};



$("aiForm").onsubmit=e=>{

  e.preventDefault();


  const input=
    $("aiInput");


  const text=
    input.value.trim();


  if(!text){

    return;

  }


  addMsg(
    text,
    "user"
  );


  input.value="";


  setTimeout(
    ()=>addMsg(
      aiReply(text),
      "bot"
    ),
    250
  );

};



function addMsg(
  text,
  type
){

  const d=
    document.createElement(
      "div"
    );


  d.className=
    "msg "+type;


  d.textContent=text;


  $("aiMessages")
    .appendChild(d);


  $("aiMessages").scrollTop=
    $("aiMessages").scrollHeight;

}



/* ================================
   RÉPONSES C.N. AI
================================ */

function aiReply(text){

  const q=
    text.toLowerCase();


  if(
    q.includes("github")
  ){

    return (
      "C.N. Nexus est conçu pour fonctionner " +
      "comme une interface statique sur GitHub Pages. " +
      "Attention : un site externe peut refuser " +
      "d'être affiché dans un iframe."
    );

  }


  if(
    q.includes("favori")
  ){

    return (
      "Utilise l'étoile ☆ à droite de la barre " +
      "d'adresse. Les favoris conservent les vraies " +
      "adresses, tandis que C.N. Nexus affiche " +
      "la version .nexus."
    );

  }


  if(
    q.includes("onglet")
  ){

    return (
      "Le bouton ＋ crée un nouvel onglet. " +
      "Chaque onglet conserve sa propre adresse réelle. " +
      "Le nom de l'onglet reste volontairement court " +
      "pour éviter les onglets gigantesques."
    );

  }


  if(
    q.includes("iframe")||
    q.includes("bloque")
  ){

    return (
      "Nexus essaie d'abord d'afficher la page dans " +
      "l'iframe. Si aucun chargement n'est détecté " +
      "après quelques secondes, il tente d'ouvrir " +
      "la vraie adresse dans un nouvel onglet."
    );

  }


  if(
    q.includes("nexus")||
    q.includes("adresse")
  ){

    return (
      "C.N. Nexus affiche les adresses avec un faux " +
      "suffixe .nexus. La vraie URL n'est jamais " +
      "modifiée : elle reste utilisée pour la navigation, " +
      "l'historique, les favoris et les onglets."
    );

  }


  if(
    q.includes("nom")
  ){

    return (
      "Le nom est C.N. Nexus : C.N. pour " +
      "C.N. Organization, et Nexus pour l'idée " +
      "d'un point de connexion."
    );

  }


  if(
    q.includes("bonjour")||
    q.includes("salut")
  ){

    return (
      "Salut ! 👋 Que veux-tu faire " +
      "dans C.N. Nexus ?"
    );

  }


  return (
    "Je suis actuellement la version locale " +
    "de C.N. AI. Pour une IA en ligne, il faudra " +
    "connecter un backend ou une API sans exposer " +
    "de clé secrète."
  );

}



/* ================================
   INITIALISATION
================================ */

renderTabs();

renderBookmarks();

homePage();


</script>
