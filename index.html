<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>C.N. Nexus</title>

<style>

:root{
  --bg:#05050a;
  --panel:#0b0a14;
  --panel2:#111020;
  --border:#29204d;
  --violet:#8b5cf6;
  --indigo:#4f46e5;
  --text:#f5f3ff;
  --muted:#aaa5bd;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}


/* =========================================================
   CHROME NEXUS
========================================================= */

#nexusChrome{
  display:flex;
  flex-direction:column;

  flex-shrink:0;

  transition:
    transform .28s ease,
    opacity .22s ease;

  z-index:50;
}

body.chrome-collapsed #nexusChrome{
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none;
}


/* =========================================================
   BOUTON POUR RABATTRE / AFFICHER
========================================================= */

#chromeToggle{
  position:fixed;

  top:8px;
  right:8px;

  width:34px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid #39266d;

  border-radius:9px;

  background:#0d0b18;

  color:#e9e1ff;

  cursor:pointer;

  z-index:100;

  font-size:15px;

  opacity:.8;

  transition:
    opacity .2s ease,
    background .2s ease;
}

#chromeToggle:hover{
  opacity:1;
  background:#18132b;
}

body:not(.chrome-collapsed) #chromeToggle{
  opacity:.25;
}

body:not(.chrome-collapsed) #chromeToggle:hover{
  opacity:1;
}

body.chrome-collapsed #chromeToggle{
  top:10px;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:58px;
  min-height:58px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 14px;

  background:
    linear-gradient(
      90deg,
      #090812,
      #0d0b19,
      #090812
    );

  border-bottom:
    1px solid var(--border);

  box-shadow:var(--shadow);
}

.logo{
  width:36px;
  height:36px;

  flex:0 0 36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  font-size:19px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 22px
    rgba(139,92,246,.3);
}

.brand{
  min-width:0;

  display:flex;
  flex-direction:column;
}

.brand strong{
  font-size:15px;
  line-height:17px;
}

.brand span{
  color:var(--muted);
  font-size:10px;
}

.ai-button{
  margin-left:auto;

  border:
    1px solid #38266d;

  background:#120d25;

  color:#dcd1ff;

  border-radius:10px;

  padding:9px 13px;

  cursor:pointer;

  font-weight:700;
}

.ai-button:hover{
  background:#1a1234;
}


/* =========================================================
   TABS NEXUS
========================================================= */

#tabs{
  height:40px;
  min-height:40px;

  display:flex;
  align-items:flex-end;

  gap:5px;

  padding:0 8px;

  background:#080711;

  border-bottom:
    1px solid var(--border);

  overflow-x:auto;
  overflow-y:hidden;
}

#tabs::-webkit-scrollbar{
  height:3px;
}

#tabs::-webkit-scrollbar-thumb{
  background:#39266d;
  border-radius:10px;
}

.tab{
  max-width:220px;
  min-width:0;

  height:34px;

  padding:0 12px;

  border:
    1px solid transparent;

  border-radius:
    10px 10px 0 0;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  flex-shrink:0;
}

.tab.active{
  background:var(--panel);

  border-color:
    var(--border);

  border-bottom-color:
    var(--panel);

  color:var(--text);
}

@media(max-width:760px){

  .tab{
    max-width:170px;
  }

}

@media(max-width:430px){

  .tab{
    max-width:125px;
  }

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  height:52px;
  min-height:52px;

  display:flex;
  align-items:center;

  gap:7px;

  padding:7px 10px;

  background:var(--panel);

  border-bottom:
    1px solid var(--border);
}

.tool{
  width:35px;
  height:35px;

  flex:0 0 35px;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:#0d0b18;

  color:var(--text);

  cursor:pointer;

  font-size:16px;
}

.tool:hover{
  background:#171329;
}

.address-wrap{
  min-width:0;
  flex:1;

  height:35px;

  display:flex;
  align-items:center;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:#080711;

  overflow:hidden;
}

.address{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  padding:0 13px;

  font-size:13px;
}

.address::placeholder{
  color:#77718d;
}


/* =========================================================
   LAYOUT
========================================================= */

.layout{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:
    230px 1fr;
}

.sidebar{
  min-width:0;

  background:#080711;

  border-right:
    1px solid var(--border);

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.sidebar-title{
  padding:
    15px 14px 10px;

  font-size:12px;

  font-weight:800;

  color:#d7d0e8;
}

#favorites{
  overflow:auto;

  padding:
    0 8px 12px;
}

.favorite{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:10px;

  border-radius:9px;

  cursor:pointer;

  text-align:left;

  font-size:12px;
}

.favorite:hover{
  background:#121021;
  color:var(--text);
}

.favorite-name{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.empty-favorites{
  padding:10px;

  color:#68627a;

  font-size:11px;
}

.main{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  position:relative;
}

#page{
  flex:1;
  min-height:0;

  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(79,70,229,.09),
      transparent 42%
    ),
    var(--bg);
}

#status{
  height:25px;
  min-height:25px;

  display:flex;
  align-items:center;

  padding:0 10px;

  border-top:
    1px solid var(--border);

  background:#080711;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   HOME
========================================================= */

.home{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;
}

.home-card{
  width:min(700px,100%);

  text-align:center;

  padding:30px;
}

.home-logo{
  width:70px;
  height:70px;

  margin:
    0 auto 18px;

  border-radius:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 45px
    rgba(139,92,246,.28);
}

.home h1{
  margin:
    0 0 8px;

  font-size:29px;
}

.home p{
  margin:0;

  color:var(--muted);

  font-size:13px;
}

.home-search{
  margin:
    24px auto 0;

  display:flex;

  max-width:560px;

  gap:8px;
}

.home-search input{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 13px;
}

.primary{
  height:42px;

  border:
    1px solid #5533a1;

  border-radius:11px;

  padding:
    0 17px;

  background:
    linear-gradient(
      135deg,
      #6538bf,
      #4036c7
    );

  color:white;

  font-weight:800;

  cursor:pointer;
}

.primary:hover{
  filter:brightness(1.1);
}


/* =========================================================
   NEXUSSEARCH
========================================================= */

.nexus-search-page{
  width:100%;
  height:100%;
  overflow:auto;
  padding:28px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,92,246,.10),
      transparent 42%
    ),
    var(--bg);
}

.nexus-search-inner{
  width:min(1000px,100%);
  margin:0 auto;
}

.nexus-search-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
}

.nexus-search-mini-logo{
  width:42px;
  height:42px;
  flex:0 0 42px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:13px;

  font-weight:900;
  font-size:19px;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 28px
    rgba(139,92,246,.25);
}

.nexus-search-title{
  font-size:20px;
  font-weight:900;
}

.nexus-search-subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}


/* =========================================================
   MODES DE RECHERCHE
========================================================= */

.nexus-search-modes{
  display:flex;

  gap:5px;

  margin-bottom:13px;

  padding:4px;

  width:max-content;
  max-width:100%;

  border:
    1px solid var(--border);

  border-radius:11px;

  background:#080711;

  overflow-x:auto;
}

.nexus-search-mode{
  border:0;

  border-radius:8px;

  background:transparent;

  color:var(--muted);

  padding:8px 13px;

  cursor:pointer;

  font-size:12px;

  font-weight:700;

  white-space:nowrap;
}

.nexus-search-mode:hover{
  background:#121021;
  color:var(--text);
}

.nexus-search-mode.active{
  background:#211642;

  color:#eee8ff;

  box-shadow:
    0 0 0 1px #4a347d;
}


/* =========================================================
   RECHERCHE
========================================================= */

.nexus-search-form{
  display:flex;

  gap:8px;

  margin-bottom:8px;
}

.nexus-search-input{
  flex:1;

  min-width:0;

  height:43px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 13px;

  font-size:13px;
}

.nexus-search-input:focus{
  border-color:#5533a1;

  box-shadow:
    0 0 0 2px
    rgba(139,92,246,.10);
}

.nexus-search-france{
  color:#aaa5bd;

  font-size:10px;

  margin:
    0 0 20px 2px;
}


/* =========================================================
   RESULTATS WEB
========================================================= */

.nexus-search-result{
  display:block;

  width:100%;

  text-align:left;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:#0b0a14;

  padding:15px;

  margin-bottom:10px;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.nexus-search-result:hover{
  background:#111020;

  border-color:#4a347d;

  transform:translateY(-1px);
}

.nexus-search-result-title{
  color:#cdbdff;

  font-size:14px;

  font-weight:800;

  line-height:1.35;

  margin-bottom:5px;
}

.nexus-search-result-url{
  color:#8f86a6;

  font-size:10px;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  margin-bottom:7px;
}

.nexus-search-result-desc{
  color:#aaa5bd;

  font-size:12px;

  line-height:1.5;
}

.nexus-search-fr-badge{
  display:inline-block;

  margin-top:8px;

  padding:3px 7px;

  border-radius:6px;

  background:#211642;

  color:#cdbdff;

  font-size:9px;

  font-weight:800;
}


/* =========================================================
   IMAGES
========================================================= */

.nexus-image-grid{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(180px,1fr)
    );

  gap:12px;
}

.nexus-image-card{
  border:
    1px solid var(--border);

  border-radius:13px;

  overflow:hidden;

  background:#0b0a14;

  cursor:pointer;

  transition:
    transform .15s ease,
    border-color .15s ease;
}

.nexus-image-card:hover{
  transform:translateY(-2px);

  border-color:#4a347d;
}

.nexus-image-preview{
  width:100%;

  aspect-ratio:4 / 3;

  object-fit:cover;

  display:block;

  background:#111020;
}

.nexus-image-info{
  padding:10px;
}

.nexus-image-title{
  color:#ddd7ed;

  font-size:11px;

  font-weight:700;

  line-height:1.4;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

  overflow:hidden;
}

.nexus-image-license{
  color:#77718d;

  font-size:9px;

  margin-top:5px;
}


/* =========================================================
   VIDEOS
========================================================= */

.nexus-video-icon{
  width:44px;
  height:44px;

  flex:0 0 44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:12px;

  background:#211642;

  color:#cdbdff;

  font-size:20px;
}

.nexus-video-result{
  display:flex;

  align-items:center;

  gap:13px;

  width:100%;

  text-align:left;

  border:
    1px solid var(--border);

  border-radius:13px;

  background:#0b0a14;

  padding:13px;

  margin-bottom:10px;

  cursor:pointer;

  transition:
    background .15s ease,
    border-color .15s ease,
    transform .15s ease;
}

.nexus-video-result:hover{
  background:#111020;

  border-color:#4a347d;

  transform:translateY(-1px);
}

.nexus-video-content{
  min-width:0;
  flex:1;
}


/* =========================================================
   INFOS / ERREURS
========================================================= */

.nexus-search-info{
  color:var(--muted);

  font-size:11px;

  margin-bottom:12px;
}

.nexus-search-correction{
  margin:
    -5px 0 14px;

  color:#cdbdff;

  font-size:11px;
}

.nexus-search-empty,
.nexus-search-error,
.nexus-search-loading{
  border:
    1px solid var(--border);

  border-radius:13px;

  background:#0b0a14;

  padding:18px;

  color:var(--muted);

  font-size:12px;

  line-height:1.5;
}

.nexus-search-error{
  border-color:#5b2940;

  color:#ffb4c6;
}

.nexus-search-page::-webkit-scrollbar{
  width:8px;
}

.nexus-search-page::-webkit-scrollbar-thumb{
  background:#302050;

  border-radius:10px;
}


/* =========================================================
   IFRAME
========================================================= */

.browser-frame{
  width:100%;
  height:100%;

  display:block;

  border:0;

  background:white;
}


/* =========================================================
   FALLBACK
========================================================= */

.external-fallback{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #080711,
      #05050a
    );

  z-index:10;

  padding:25px;
}

.external-fallback-box{
  width:min(
    520px,
    100%
  );

  background:#0d0b18;

  border:
    1px solid #38266d;

  border-radius:18px;

  padding:28px;

  text-align:center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);
}

.external-fallback-title{
  font-size:18px;

  font-weight:800;

  line-height:1.35;

  margin-bottom:12px;
}

.external-fallback-text{
  color:var(--muted);

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;
}

.external-fallback-url{
  color:#c9b9ff;

  font-size:12px;

  margin-bottom:20px;

  word-break:break-word;
}

.external-fallback-button{
  width:100%;
}


/* =========================================================
   AI
========================================================= */

.ai-panel{
  position:absolute;

  right:15px;
  bottom:42px;

  width:min(
    360px,
    calc(100% - 30px)
  );

  max-height:500px;

  display:none;
  flex-direction:column;

  background:#0b0a14;

  border:
    1px solid #39266d;

  border-radius:16px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.6);

  overflow:hidden;

  z-index:30;
}

.ai-panel.open{
  display:flex;
}

.ai-head{
  padding:
    13px 15px;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.ai-head strong{
  font-size:13px;
}

.ai-close{
  border:0;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:17px;
}

.ai-messages{
  flex:1;

  min-height:180px;

  max-height:330px;

  overflow:auto;

  padding:12px;
}

.ai-message{
  padding:
    9px 11px;

  margin-bottom:8px;

  border-radius:10px;

  font-size:12px;

  line-height:1.45;
}

.ai-message.bot{
  background:#111020;

  color:#ddd7ed;
}

.ai-message.user{
  background:#211642;

  color:#eee8ff;

  margin-left:25px;
}

.ai-form{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid var(--border);
}

.ai-input{
  flex:1;

  min-width:0;

  height:36px;

  border:
    1px solid var(--border);

  border-radius:9px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 10px;

  font-size:12px;
}

.ai-send{
  width:38px;
  height:36px;

  border:
    1px solid #5533a1;

  border-radius:9px;

  background:#34236c;

  color:white;

  cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  header{
    padding:
      0 9px;
  }

  .brand span{
    display:none;
  }

  .brand strong{
    font-size:14px;
  }

  .ai-button{
    padding:
      8px 10px;

    font-size:11px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .toolbar{
    gap:5px;

    padding:7px;
  }

  .tool{
    width:33px;

    flex-basis:33px;
  }

  .address{
    font-size:12px;
  }

  .home{
    padding:15px;
  }

  .home-card{
    padding:
      20px 10px;
  }

  .home h1{
    font-size:24px;
  }

  .home-search{
    flex-direction:column;
  }

  .primary{
    width:100%;
  }

  .ai-panel{
    right:10px;

    bottom:34px;
  }

  .nexus-search-page{
    padding:18px 12px;
  }

  .nexus-search-form{
    flex-direction:column;
  }

  .nexus-search-form .primary{
    width:100%;
  }

  .nexus-search-modes{
    width:100%;
  }

  .nexus-search-mode{
    flex:1;
    padding:
      8px 8px;
  }

  .nexus-image-grid{
    grid-template-columns:
      repeat(
        2,
        minmax(0,1fr)
      );
  }

}


/* =========================================================
   TRES PETIT ECRAN
========================================================= */

@media(max-width:430px){

  .tab{
    max-width:125px;
  }

  .nexus-image-grid{
    grid-template-columns:1fr;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     BOUTON CHROME
===================================================== -->

<button
  id="chromeToggle"
  title="Rabattre la barre Nexus"
  aria-label="Rabattre la barre Nexus"
>
  ⌃
</button>


<!-- =====================================================
     CHROME NEXUS
===================================================== -->

<div id="nexusChrome">


<header>

  <div class="logo">
    N
  </div>

  <div class="brand">

    <strong>
      C.N. Nexus
    </strong>

    <span>
      by C.N. Organization
    </span>

  </div>

  <button
    class="ai-button"
    id="aiOpen"

    "doctissimo.fr",
    "wikipedia.org/wiki/Accueil"
  ];

  if(
    frenchDomains.some(
      domain =>
        url.includes(domain)
    )
  ){

    return true;

  }

  const frenchWords = [

  const combined =

  return frenchWords.some(

      combined.includes(word)
  );

}


/* =========================================================
   SCORE FRANCAIS
========================================================= */

function frenchScore(result){

  let score = 0;

  const url =
    String(
      result.url ||
      result.displayUrl ||
      ""
    ).toLowerCase();

  if(
    /\.fr(?:[/:?#]|$)/i.test(url)
  ){

    score += 12;

  }

  if(
    url.includes("gouv.fr")
  ){

    score += 10;

  }

  if(
    isFrenchResult(result)
  ){

    score += 5;

  }

  return score;

}

function displayUrl(url){

  if(!url){

  try{

      new URL(url);

    let host =
      parsed.hostname;

    if(
      host.startsWith("www.")
    ){

      host =
        host.slice(4);

    }

    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }

    const lastDot =
      host.lastIndexOf(".");

    if(
      lastDot > 0
    ){

      host =
        host.slice(
          0,
          lastDot
        ) +
        ".nexus";

    }else{

      host +=
        ".nexus";

    }

    return (
      host +
      parsed.pathname +
      parsed.search +
      parsed.hash
    );

  }catch{

    return url;

  }

}

/* =========================================================
   NORMALISER URL
========================================================= */

function looksLikeUrl(value){

  return (
    /^https?:\/\//i.test(value) ||
    /^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/.*)?$/i.test(value)
  );

}


function normalizeUrl(value){

  value =
    String(value || "")
      .trim();

  if(!value){

    return "";

  }

  if(
    !value.includes("://") &&
    /\.nexus(?=[:/?#]|$)/i.test(value)
  ){

    value =
      value.replace(
        /\.nexus(?=[:/?#]|$)/i,
        ".com"
      );

  }

  if(
    !value.includes("://")
  ){

    value =
      "https://" +
      value;

  }

  try{

    const parsed =
      new URL(value);

    if(
      parsed.hostname
        .endsWith(".nexus")
    ){

      parsed.hostname =
        parsed.hostname.replace(
          /\.nexus$/i,
          ".com"
        );

    }

    return parsed.toString();

  }catch{

    return "";

  }

}


function normalize(value){

  const text =
    String(value || "")
      .trim();

  if(!text){

    return "";

  }

  if(!looksLikeUrl(text)){

    return "";

  }

  return normalizeUrl(text);

}


function isSearchInput(value){

  return (
    !!text &&

/* =========================================================
   REQUETE FRANCAISE
========================================================= */

function buildSearchQuery(query, mode){

  const clean =
    String(query || "")
      .trim();

  /*
    On ne force pas "France" pour toutes les recherches :
    cela pourrait dégrader fortement les recherches
    internationales.

    Pour Web/Vidéos, on ajoute seulement une indication
    francophone afin de favoriser ce contexte.
  */

  if(
    mode === "web" ||
    mode === "videos"
  ){

    return (
      clean +
      " français France"
    );

  }

  return clean;

}


/* =========================================================
   RECHERCHE PRINCIPALE
========================================================= */

async function runNexusSearch(
  query,
  pageNumber = 1
){

  const cleanQuery =
    String(query || "")
      .trim();

  if(!cleanQuery){

    showHome();

    return;

  }


  const tab =
    getActiveTab();

  if(tab){

    tab.url =
      "";

    tab.title =
      "NexusSearch";

  }


  address.value =
    cleanQuery;

  renderTabs();

  renderNexusSearchShell(
    cleanQuery
  );


  setStatus(
    "NexusSearch — " +
    getSearchModeLabel() +
    " — recherche de « " +
    cleanQuery +
    " »"
  );


  try{

    if(
      nexusSearchMode === "images"
    ){

      await runNexusImages(
        cleanQuery,
        pageNumber
      );

      return;

    }


    const searchQuery =
      buildSearchQuery(
        cleanQuery,
        nexusSearchMode
      );


    const params =
      new URLSearchParams({

        q:searchQuery,

        page:String(pageNumber),

        exact:"0"

      });


    const response =
      await fetch(

        NEXUS_SEARCH_API +
        "?" +
        params.toString(),

        {
          method:"GET",

          headers:{
            "Accept":
              "application/json"
          }

        }

      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      Tout et Web utilisent les résultats
      du moteur Purili.

      Vidéos filtre les pages dont le contenu
      ressemble davantage à des pages vidéo.
    */

    let results =
      Array.isArray(data.results)
        ? data.results
        : [];


    if(
      nexusSearchMode === "videos"
    ){

      results =
        filterVideoResults(
          results
        );

    }


    results =
      prioritizeFrenchResults(
        results
      );


    renderNexusSearchResults(
      cleanQuery,
      {
        ...data,
        results
      }
    );


  }catch(error){

    const results =
      $("nexusSearchResults");

    if(results){

      results.className =
        "nexus-search-error";

      results.textContent =
        "NexusSearch n'a pas pu récupérer les résultats. " +
        "Réessaie dans quelques instants. (" +
        (
          error.message ||
          "erreur inconnue"
        ) +
        ")";

    }


    setStatus(
      "Erreur NexusSearch"
    );

  }

}


/* =========================================================
   LABEL MODE
========================================================= */

function getSearchModeLabel(){

  switch(
    nexusSearchMode
  ){

    case "web":

    case "videos":

    default:

  }

}


/* =========================================================
   PRIORITE FRANCAISE
========================================================= */

function prioritizeFrenchResults(
  results
){

  return [...results].sort(
    (a,b) => {

      const frenchDifference =
        frenchScore(b) -
        frenchScore(a);

      if(
        frenchDifference !== 0
      ){

        return frenchDifference;

      }

      return 0;

    }
  );

}


/* =========================================================
   DETECTION VIDEO
========================================================= */

function filterVideoResults(
  results
){

  const videoDomains = [

    "youtube.com",
    "youtu.be",
    "dailymotion.com",
    "vimeo.com",
    "twitch.tv",
    "arte.tv",
    "france.tv",
    "tf1.fr",
    "m6.fr",
    "bfmtv.com",
    "france24.com"

  ];


  const videoWords = [

    "vidéo",
    "video",
    "watch",
    "regarder",
    "youtube",
    "dailymotion",
    "vimeo",
    "stream",
    "replay",
    "reportage"

  ];


  const filtered =
    results.filter(
      result => {

        const url =
          String(
            result.url ||
            ""
          ).toLowerCase();

        const text =
          (
            String(
              result.title ||
              ""
            ) +
            " " +
            String(
              result.description ||
              ""
            ) +
            " " +
            url
          ).toLowerCase();

        return (
          videoDomains.some(
            domain =>
              url.includes(domain)
          ) ||
          videoWords.some(
            word =>
              text.includes(word)
          )
        );

      }
    );


  /*
    Si le moteur n'a trouvé aucune page
    clairement vidéo, on garde quand même
    les résultats de la recherche Web afin
    que l'onglet ne soit jamais vide.
  */

  return filtered.length
    ? filtered
    : results;

}

  const images =
    Array.isArray(data.images)
      ? data.images
      : [];


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "nexus-search-info";

  info.textContent =
    images.length +
    " image" +
    (
      images.length > 1
        ? "s"
        : ""
    ) +
    " pour « " +
    query +
    " »";

  container.appendChild(
    info
  );


  if(images.length === 0){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "nexus-search-empty";

    empty.textContent =
      "Aucune image trouvée.";

    container.appendChild(
      empty
    );

    return;

  }


  const grid =
    document.createElement(
      "div"
    );

  grid.className =
    "nexus-image-grid";


  images.forEach(
    image => {

      const card =
        document.createElement(
          "div"
        );

      card.className =
        "nexus-image-card";


      const preview =
        document.createElement(
          "img"
        );

      preview.className =
        "nexus-image-preview";

      preview.loading =
        "lazy";

      preview.alt =
        image.title ||
        "Image";


      /*
        Purili fournit thumbUrl.
      */

      preview.src =
        image.thumbUrl ||
        image.url ||
        "";


      const infoBox =
        document.createElement(
          "div"
        );

      infoBox.className =
        "nexus-image-info";


      const title =
        document.createElement(
          "div"
        );

      title.className =
        "nexus-image-title";

      title.textContent =
        image.title ||
        "Image";


      const license =
        document.createElement(
          "div"
        );

      license.className =
        "nexus-image-license";

      license.textContent =
        image.license
          ? "Licence : " +
            image.license
          : "Source : Wikimedia";


      infoBox.append(
        title,
        license
      );


      card.append(
        preview,
        infoBox
      );


      card.onclick =
        () => {

          const target =
            image.url ||
            image.thumbUrl;

          if(target){

            window.open(
              target,
              "_blank"
            );

          }

        };


      grid.appendChild(
        card
      );

    }
  );


  container.appendChild(
    grid
  );


  if(
    data.total >
    images.length
  ){

    const more =
      document.createElement(
        "button"
      );

    more.className =
      "primary";

    more.style.marginTop =
      "14px";

    more.textContent =
      "Charger plus d'images";

    more.onclick =
      () => {

        runNexusImages(
          query,
          Number(
            data.page || pageNumber
          ) + 1
        );

      };

    container.appendChild(
      more
    );

  }


  setStatus(
    "NexusSearch — Images — " +
    images.length +
    " résultat" +
    (
      images.length > 1
        ? "s"
        : ""
    )
  );

}


/* =========================================================
   RESULTATS WEB / TOUT / VIDEOS
========================================================= */

function renderNexusSearchResults(
  query,
  data
){

  const container =
    $("nexusSearchResults");

  if(!container){

    return;

  }


  container.className =
    "";

  container.innerHTML =
    "";


  const results =
    Array.isArray(data.results)
      ? data.results
      : [];


  const info =
    document.createElement(
      "div"
    );

  info.className =
    "nexus-search-info";


  let label =
    "résultat";

  if(
    nexusSearchMode === "videos"
  ){

    label =
      "résultat vidéo";

  }


  info.textContent =
    results.length +
    " " +
    label +
    (
      results.length > 1
        ? "s"
        : ""
    ) +
    " pour « " +
    query +
    " »";


  container.appendChild(
    info
  );


  if(data.correction){

    const correction =
      document.createElement(
        "div"
      );

    correction.className =
      "nexus-search-correction";


    if(
      data.correction.corrected
    ){

      correction.textContent =
        "Recherche corrigée : " +
        data.correction.corrected;

    }


    container.appendChild(
      correction
    );

  }


  if(results.length === 0){

    const empty =
      document.createElement(
        "div"
      );

    empty.className =
      "nexus-search-empty";

    empty.textContent =
      nexusSearchMode === "videos"
        ? "Aucune vidéo trouvée. Essaie une recherche plus précise."
        : "Aucun résultat trouvé. Essaie avec une recherche différente.";


    container.appendChild(
      empty
    );

    return;

  }


  results.forEach(
    result => {

      if(
        nexusSearchMode === "videos"
      ){

        renderVideoResult(
          container,
          result
        );

      }else{

        renderWebResult(
          container,
          result
        );

      }

    }
  );


  if(data.hasNext){

    const more =
      document.createElement(
        "button"
      );

    more.className =
      "primary";

    more.style.marginTop =
      "8px";

    more.textContent =
      "Charger plus de résultats";


    more.onclick =
      () => {

        runNexusSearch(
          query,
          Number(
            data.page || 1
          ) + 1
        );

      };


    container.appendChild(
      more
    );

  }


  setStatus(
    "NexusSearch — " +
    getSearchModeLabel() +
    " — " +
    results.length +
    " résultat" +
    (
      results.length > 1
        ? "s"
        : ""
    )
  );

}

/* =========================================================
   NAVIGATION
========================================================= */

function navigate(
  value,
  push = true
){

  const rawValue =
    String(value || "")
      .trim();


  if(isSearchInput(rawValue)){

    runNexusSearch(
      rawValue
    );

    return;

  }


  const url =
    normalize(rawValue);


  if(!url){

    showHome();

    return;

  }


  const t =
    getActiveTab();


  if(!t){

    return;

  }


  t.url =
    url;


  try{

    t.title =
      new URL(url)
        .hostname;

  }catch{

    t.title =
      "C.N. Nexus";

  }


  address.value =
    displayUrl(url);

  renderTabs();


  if(push){

    history =
      history.slice(
        0,
        historyIndex + 1
      );


    history.push(
      url
    );


    historyIndex =
      history.length - 1;

  }


  if(
    isKnownIframeBlocked(url)
  ){

    showExternalFallback(
      url
    );

    updateBookmarkButton();

    return;

  }


  page.innerHTML =
    "";


  const frame =
    document.createElement(
      "iframe"
    );


  frame.className =
    "browser-frame";


  frame.setAttribute(
    "allowfullscreen",
    ""
  );


  frame.setAttribute(
    "referrerpolicy",
    "no-referrer-when-downgrade"
  );


  frame.src =
    url;


  page.appendChild(
    frame
  );


  setStatus(
    "Chargement — " +
    displayUrl(url)
  );


  frame.addEventListener(
    "load",
    () => {

      setStatus(
        "Page chargée — " +
        displayUrl(url)
      );

    },
    {
      once:true
    }
  );


  updateBookmarkButton();

}


/* =========================================================
   CHARGER ONGLET
========================================================= */

function loadCurrent(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    page.innerHTML =
      "";

    address.value =
      "";

    showHome();

    setStatus(
      "Prêt"
    );

    updateBookmarkButton();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   NOUVEL ONGLET
========================================================= */

function newTab(){

  const id =
    Date.now();


  tabs.push({

    id:id,

    title:
      "Nouvel onglet",

    url:
      ""

  });


  activeTab =
    id;


  renderTabs();

  loadCurrent();

  address.focus();

}


/* =========================================================
   ACCUEIL
========================================================= */

function goHome(){

  const t =
    getActiveTab();


  if(!t){

    return;

  }


  t.url =
    "";

  t.title =
    "Nouvel onglet";


  renderTabs();

  loadCurrent();

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    loadCurrent();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

  if(
    historyIndex <= 0
  ){

    setStatus(
      "Pas de page précédente"
    );

    return;

  }


  historyIndex--;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FORWARD
========================================================= */

function goForward(){

  if(
    historyIndex >=
    history.length - 1
  ){

    setStatus(
      "Pas de page suivante"
    );

    return;

  }


  historyIndex++;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FAVORIS
========================================================= */

function getBookmarks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveBookmarks(
  bookmarks
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(bookmarks)
  );

}


function renderFavorites(){

  const container =
    $("favorites");


  const bookmarks =
    getBookmarks();


  container.innerHTML =
    "";


  if(
    bookmarks.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-favorites";


    empty.textContent =
      "Aucun favori";


    container.appendChild(
      empty
    );


    return;

  }


  bookmarks.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "favorite";


      const icon =
        document.createElement(
          "span"
        );


      icon.textContent =
        "★";


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "favorite-name";


      name.textContent =
        item.title ||
        tabLabel(item.url);


      button.title =
        displayUrl(item.url);


      button.append(
        icon,
        name
      );


      button.onclick =
        () => {

          navigate(
            item.url
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


function toggleBookmark(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    setStatus(
      "Aucune page à ajouter aux favoris"
    );

    return;

  }


  const bookmarks =
    getBookmarks();


  const existing =
    bookmarks.findIndex(
      item =>
        item.url === t.url
    );


  if(
    existing !== -1
  ){

    bookmarks.splice(
      existing,
      1
    );


    saveBookmarks(
      bookmarks
    );


    renderFavorites();


    setStatus(
      "Favori supprimé"
    );


    $("bookmark").textContent =
      "☆";


    return;

  }


  bookmarks.push({

    title:
      tabLabel(t.url),

    url:
      t.url

  });


  saveBookmarks(
    bookmarks
  );


  renderFavorites();


  setStatus(
    "Ajouté aux favoris — " +
    displayUrl(t.url)
  );


  $("bookmark").textContent =
    "★";

}


function updateBookmarkButton(){

  const t =
    getActiveTab();


  const button =
    $("bookmark");


  if(
    !t ||
    !t.url
  ){

    button.textContent =
      "☆";

    return;

  }


  const bookmarks =
    getBookmarks();


  const exists =
    bookmarks.some(
      item =>
        item.url === t.url
    );


  button.textContent =
    exists
      ? "★"
      : "☆";

}


/* =========================================================
   C.N. AI
========================================================= */

function aiReply(message){

  const text =
    message
      .toLowerCase()
      .trim();


  if(
    text.includes("iframe")
  ){

    return (
      "Nexus affiche directement une page externe " +
      "si elle peut être intégrée. Certains sites " +
      "refusent volontairement les iframes."
    );

  }


  if(
    text.includes("nexus") ||
    text.includes("url")
  ){

    return (
      "Le .nexus affiché dans la barre est visuel. " +
      "Par exemple google.com devient google.nexus, " +
      "mais Nexus utilise toujours l'adresse réelle."
    );

  }


  if(
    text.includes("barre") ||
    text.includes("rabatt")
  ){

    return (
      "Le bouton ⌃ permet de rabattre toute l'interface " +
      "Nexus pour afficher davantage la page."
    );

  }


  if(
    text.includes("recherche") ||
    text.includes("nexussearch")
  ){

    return (
      "NexusSearch propose Tout, Web, Images et Vidéos. " +
      "Les résultats français et francophones sont privilégiés."
    );

  }


  if(
    text.includes("image")
  ){

    return (
      "L'onglet Images utilise l'API images de Purili."
    );

  }


  if(
    text.includes("vidéo") ||
    text.includes("video")
  ){

    return (
      "L'onglet Vidéos recherche des pages vidéo dans " +
      "l'index Web et privilégie les résultats français."
    );

  }


  if(
    text.includes("favori")
  ){

    return (
      "Le bouton ☆ permet d'ajouter la page actuelle aux favoris."
    );

  }


  if(
    text.includes("nouvel onglet")
  ){

    return (
      "Le bouton + permet de créer un nouvel onglet."
    );

  }


  if(
    text.includes("bonjour") ||
    text.includes("salut") ||
    text === "yo"
  ){

    return (
      "Salut 👋 Comment puis-je t'aider avec C.N. Nexus ?"
    );

  }


  return (
    "Je suis C.N. AI. Je peux t'aider avec " +
    "les fonctions de C.N. Nexus."
  );

}


function addAiMessage(
  text,
  type
){

  const container =
    $("aiMessages");


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "ai-message " +
    type;


  message.textContent =
    text;


  container.appendChild(
    message
  );


  container.scrollTop =
    container.scrollHeight;

}

   EVENEMENTS
========================================================= */

  goBack;


$("forward").onclick =
  goForward;


$("reload").onclick =
  reload;


$("home").onclick =
  goHome;


$("newTab").onclick =
  newTab;


$("bookmark").onclick =

   BARRE ADRESSE
========================================================= */

address.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      navigate(
        address.value
      );

    }

  }
);


/* =========================================================
   BOUTON RABATTRE
========================================================= */

$("chromeToggle").onclick =
  () => {

    const collapsed =
      document.body.classList.toggle(
        "chrome-collapsed"
      );


    const button =
      $("chromeToggle");


    if(collapsed){

      button.textContent =
        "⌄";

      button.title =
        "Afficher la barre Nexus";

      button.setAttribute(
        "aria-label",
        "Afficher la barre Nexus"
      );

    }else{

      button.textContent =
        "⌃";

      button.title =
        "Rabattre la barre Nexus";

      button.setAttribute(
        "aria-label",
        "Rabattre la barre Nexus"
      );

    }

  };


/* =========================================================
   AI
========================================================= */

$("aiOpen").onclick =
  () => {

    $("aiPanel")
      .classList
      .toggle("open");

  };


$("aiClose").onclick =
  () => {

    $("aiPanel")
      .classList
      .remove("open");

  };


$("aiForm").addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const input =
      $("aiInput");


    const value =
      input.value.trim();


    if(!value){

      return;

    }


    addAiMessage(
      value,
      "user"
    );


    input.value =
      "";


    setTimeout(
      () => {

        addAiMessage(
          aiReply(value),
          "bot"
        );

      },
      250
    );

  }
);


/* =========================================================
   INITIALISATION
========================================================= */

renderTabs();

renderFavorites();

showHome();

updateBookmarkButton();

setStatus(
  "Prêt"
);

</script>
