<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>C.N. Nexus</title>

<style>

:root{
  --bg:#05050a;
  --panel:#0b0a14;
  --panel2:#111020;
  --border:#29204d;
  --violet:#8b5cf6;
  --indigo:#4f46e5;
  --text:#f5f3ff;
  --muted:#aaa5bd;
  --shadow:0 12px 40px rgba(0,0,0,.45);
}

*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body{
  display:flex;
  flex-direction:column;
}


/* =========================================================
   CHROME NEXUS
========================================================= */

#nexusChrome{
  display:flex;
  flex-direction:column;

  flex-shrink:0;

  transition:
    transform .28s ease,
    opacity .22s ease;

  z-index:50;
}

body.chrome-collapsed #nexusChrome{
  transform:translateY(-100%);
  opacity:0;
  pointer-events:none;
}


/* =========================================================
   BOUTON POUR RABATTRE / AFFICHER
========================================================= */

#chromeToggle{
  position:fixed;

  top:8px;
  right:8px;

  width:34px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:
    1px solid #39266d;

  border-radius:9px;

  background:#0d0b18;

  color:#e9e1ff;

  cursor:pointer;

  z-index:100;

  font-size:15px;

  opacity:.8;

  transition:
    opacity .2s ease,
    background .2s ease;
}

#chromeToggle:hover{
  opacity:1;
  background:#18132b;
}

body:not(.chrome-collapsed) #chromeToggle{
  opacity:.25;
}

body:not(.chrome-collapsed) #chromeToggle:hover{
  opacity:1;
}

body.chrome-collapsed #chromeToggle{
  top:10px;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:58px;
  min-height:58px;

  display:flex;
  align-items:center;

  gap:12px;

  padding:0 14px;

  background:
    linear-gradient(
      90deg,
      #090812,
      #0d0b19,
      #090812
    );

  border-bottom:
    1px solid var(--border);

  box-shadow:var(--shadow);
}

.logo{
  width:36px;
  height:36px;

  flex:0 0 36px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:11px;

  font-size:19px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 22px
    rgba(139,92,246,.3);
}

.brand{
  min-width:0;

  display:flex;
  flex-direction:column;
}

.brand strong{
  font-size:15px;
  line-height:17px;
}

.brand span{
  color:var(--muted);
  font-size:10px;
}

.ai-button{
  margin-left:auto;

  border:
    1px solid #38266d;

  background:#120d25;

  color:#dcd1ff;

  border-radius:10px;

  padding:9px 13px;

  cursor:pointer;

  font-weight:700;
}

.ai-button:hover{
  background:#1a1234;
}


/* =========================================================
   TABS
========================================================= */

#tabs{
  height:40px;
  min-height:40px;

  display:flex;
  align-items:flex-end;

  gap:5px;

  padding:0 8px;

  background:#080711;

  border-bottom:
    1px solid var(--border);

  overflow-x:auto;
  overflow-y:hidden;
}

#tabs::-webkit-scrollbar{
  height:3px;
}

#tabs::-webkit-scrollbar-thumb{
  background:#39266d;
  border-radius:10px;
}

.tab{
  max-width:220px;
  min-width:0;

  height:34px;

  padding:0 12px;

  border:
    1px solid transparent;

  border-radius:
    10px 10px 0 0;

  background:transparent;

  color:var(--muted);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  font-size:12px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  flex-shrink:0;
}

.tab.active{
  background:var(--panel);

  border-color:
    var(--border);

  border-bottom-color:
    var(--panel);

  color:var(--text);
}

@media(max-width:760px){

  .tab{
    max-width:170px;
  }

}

@media(max-width:430px){

  .tab{
    max-width:125px;
  }

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  height:52px;
  min-height:52px;

  display:flex;
  align-items:center;

  gap:7px;

  padding:7px 10px;

  background:var(--panel);

  border-bottom:
    1px solid var(--border);
}

.tool{
  width:35px;
  height:35px;

  flex:0 0 35px;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:#0d0b18;

  color:var(--text);

  cursor:pointer;

  font-size:16px;
}

.tool:hover{
  background:#171329;
}

.address-wrap{
  min-width:0;
  flex:1;

  height:35px;

  display:flex;
  align-items:center;

  border:
    1px solid var(--border);

  border-radius:10px;

  background:#080711;

  overflow:hidden;
}

.address{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  padding:0 13px;

  font-size:13px;
}

.address::placeholder{
  color:#77718d;
}

.search-engine{
  height:35px;

  border:
    1px solid var(--border);

  border-radius:9px;

  background:#0d0b18;

  color:var(--text);

  padding:
    0 8px;

  font-size:11px;

  outline:0;

  cursor:pointer;

  max-width:145px;

  flex-shrink:0;
}

.search-engine:hover{
  background:#171329;
}

.search-engine option{
  background:#0d0b18;
  color:var(--text);
}

@media(max-width:700px){

  .search-engine{
    max-width:42px;
    padding:0 5px;
  }

  .search-engine option{
    font-size:12px;
  }

}


/* =========================================================
   LAYOUT
========================================================= */

.layout{
  flex:1;
  min-height:0;

  display:grid;

  grid-template-columns:
    230px 1fr;
}

.sidebar{
  min-width:0;

  background:#080711;

  border-right:
    1px solid var(--border);

  display:flex;
  flex-direction:column;

  overflow:hidden;
}

.sidebar-title{
  padding:
    15px 14px 10px;

  font-size:12px;

  font-weight:800;

  color:#d7d0e8;
}

#favorites{
  overflow:auto;

  padding:
    0 8px 12px;
}

.favorite{
  width:100%;

  display:flex;
  align-items:center;

  gap:9px;

  border:0;

  background:transparent;

  color:var(--muted);

  padding:10px;

  border-radius:9px;

  cursor:pointer;

  text-align:left;

  font-size:12px;
}

.favorite:hover{
  background:#121021;
  color:var(--text);
}

.favorite-name{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;
}

.empty-favorites{
  padding:10px;

  color:#68627a;

  font-size:11px;
}

.main{
  min-width:0;
  min-height:0;

  display:flex;
  flex-direction:column;

  position:relative;
}

#page{
  flex:1;
  min-height:0;

  position:relative;

  overflow:hidden;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(79,70,229,.09),
      transparent 42%
    ),
    var(--bg);
}

#status{
  height:25px;
  min-height:25px;

  display:flex;
  align-items:center;

  padding:0 10px;

  border-top:
    1px solid var(--border);

  background:#080711;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   HOME
========================================================= */

.home{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px;
}

.home-card{
  width:min(700px,100%);

  text-align:center;

  padding:30px;
}

.home-logo{
  width:70px;
  height:70px;

  margin:
    0 auto 18px;

  border-radius:21px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:34px;
  font-weight:900;

  background:
    linear-gradient(
      135deg,
      var(--violet),
      var(--indigo)
    );

  box-shadow:
    0 0 45px
    rgba(139,92,246,.28);
}

.home h1{
  margin:
    0 0 8px;

  font-size:29px;
}

.home p{
  margin:0;

  color:var(--muted);

  font-size:13px;
}

.home-search{
  margin:
    24px auto 0;

  display:flex;

  max-width:560px;

  gap:8px;
}

.home-search input{
  flex:1;

  min-width:0;

  height:42px;

  border:
    1px solid var(--border);

  border-radius:11px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 13px;
}

.primary{
  height:42px;

  border:
    1px solid #5533a1;

  border-radius:11px;

  padding:
    0 17px;

  background:
    linear-gradient(
      135deg,
      #6538bf,
      #4036c7
    );

  color:white;

  font-weight:800;

  cursor:pointer;
}

.primary:hover{
  filter:brightness(1.1);
}


/* =========================================================
   IFRAME
========================================================= */

.browser-frame{
  width:100%;
  height:100%;

  display:block;

  border:0;

  background:white;
}


/* =========================================================
   FALLBACK
========================================================= */

.external-fallback{
  position:absolute;

  inset:0;

  display:flex;

  align-items:center;
  justify-content:center;

  background:
    linear-gradient(
      180deg,
      #080711,
      #05050a
    );

  z-index:10;

  padding:25px;
}

.external-fallback-box{
  width:min(
    520px,
    100%
  );

  background:#0d0b18;

  border:
    1px solid #38266d;

  border-radius:18px;

  padding:28px;

  text-align:center;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.55);
}

.external-fallback-title{
  font-size:18px;

  font-weight:800;

  line-height:1.35;

  margin-bottom:12px;
}

.external-fallback-text{
  color:var(--muted);

  font-size:13px;

  line-height:1.5;

  margin-bottom:20px;
}

.external-fallback-url{
  color:#c9b9ff;

  font-size:12px;

  margin-bottom:20px;

  word-break:break-word;
}

.external-fallback-button{
  width:100%;
}


/* =========================================================
   AI
========================================================= */

.ai-panel{
  position:absolute;

  right:15px;
  bottom:42px;

  width:min(
    360px,
    calc(100% - 30px)
  );

  max-height:500px;

  display:none;
  flex-direction:column;

  background:#0b0a14;

  border:
    1px solid #39266d;

  border-radius:16px;

  box-shadow:
    0 20px 60px
    rgba(0,0,0,.6);

  overflow:hidden;

  z-index:30;
}

.ai-panel.open{
  display:flex;
}

.ai-head{
  padding:
    13px 15px;

  border-bottom:
    1px solid var(--border);

  display:flex;

  align-items:center;
  justify-content:space-between;
}

.ai-head strong{
  font-size:13px;
}

.ai-close{
  border:0;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  font-size:17px;
}

.ai-messages{
  flex:1;

  min-height:180px;

  max-height:330px;

  overflow:auto;

  padding:12px;
}

.ai-message{
  padding:
    9px 11px;

  margin-bottom:8px;

  border-radius:10px;

  font-size:12px;

  line-height:1.45;
}

.ai-message.bot{
  background:#111020;

  color:#ddd7ed;
}

.ai-message.user{
  background:#211642;

  color:#eee8ff;

  margin-left:25px;
}

.ai-form{
  display:flex;

  gap:7px;

  padding:10px;

  border-top:
    1px solid var(--border);
}

.ai-input{
  flex:1;

  min-width:0;

  height:36px;

  border:
    1px solid var(--border);

  border-radius:9px;

  outline:0;

  background:#080711;

  color:var(--text);

  padding:
    0 10px;

  font-size:12px;
}

.ai-send{
  width:38px;
  height:36px;

  border:
    1px solid #5533a1;

  border-radius:9px;

  background:#34236c;

  color:white;

  cursor:pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

  header{
    padding:
      0 9px;
  }

  .brand span{
    display:none;
  }

  .brand strong{
    font-size:14px;
  }

  .ai-button{
    padding:
      8px 10px;

    font-size:11px;
  }

  .layout{
    grid-template-columns:1fr;
  }

  .sidebar{
    display:none;
  }

  .toolbar{
    gap:5px;

    padding:7px;
  }

  .tool{
    width:33px;

    flex-basis:33px;
  }

  .address{
    font-size:12px;
  }

  .home{
    padding:15px;
  }

  .home-card{
    padding:
      20px 10px;
  }

  .home h1{
    font-size:24px;
  }

  .home-search{
    flex-direction:column;
  }

  .primary{
    width:100%;
  }

  .ai-panel{
    right:10px;

    bottom:34px;
  }

}

</style>

</head>

<script>

/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY =
  "cn_nexus_bookmarks_v1";

const SEARCH_ENGINE_KEY =
  "cn_nexus_search_engine_v1";

const SEARCH_ENGINES = {
  mojeek: {
    name: "Mojeek",
    icon: "🔎",
    url: "https://www.mojeek.com/search?q="
  }
};


/*
  Domaines dont les pages principales sont connues
  pour refuser l'affichage dans une iframe externe.

  On les traite AVANT de créer l'iframe.

  Cela évite notamment le faux écran blanc
  que tu avais avec ChatGPT.

  Cette liste ne prétend pas couvrir tous les sites :
  les protections iframe peuvent changer et dépendent
  parfois du chemin précis de l'URL.
*/

const KNOWN_IFRAME_BLOCKED = [

  "google.com",
  "google.fr",

  "chatgpt.com",
  "chat.openai.com",
  "openai.com",

  "github.com",

  "facebook.com",

  "instagram.com",

  "x.com",
  "twitter.com",

  "reddit.com"

];


/* =========================================================
   ÉTAT
========================================================= */

let tabs = [
  {
    id:1,
    title:"Nouvel onglet",
    url:""
  }
];

let activeTab = 1;

let history = [];

let historyIndex = -1;


/* =========================================================
   ELEMENTS
========================================================= */

const $ =
  id =>
    document.getElementById(id);

const page =
  $("page");

const address =
  $("address");

const statusEl =
  $("status");

const searchEngineSelect =
  $("searchEngine");


/* =========================================================
   STATUS
========================================================= */

function setStatus(text){

  statusEl.textContent =
    text;

}


function getSearchEngine(){

  const saved =
    localStorage.getItem(
      SEARCH_ENGINE_KEY
    );

  if(
    saved &&
    SEARCH_ENGINES[saved]
  ){
    return saved;
  }

  return "mojeek";
}


function setSearchEngine(engine){

  if(
    !SEARCH_ENGINES[engine]
  ){
    engine = "mojeek";
  }

  localStorage.setItem(
    SEARCH_ENGINE_KEY,
    engine
  );

  if(searchEngineSelect){
    searchEngineSelect.value =
      engine;
  }

  setStatus(
    "Moteur de recherche : " +
    SEARCH_ENGINES[engine].name
  );
}


if(searchEngineSelect){

  searchEngineSelect.value =
    getSearchEngine();

  searchEngineSelect.addEventListener(
    "change",
    () => {

      setSearchEngine(
        searchEngineSelect.value
      );

    }
  );

}


/* =========================================================
   DOMAINE REEL
========================================================= */

function getRealHostname(url){

  try{

    return new URL(url)
      .hostname
      .toLowerCase()
      .replace(/^www\./,"");

  }catch{

    return "";

  }

}


/* =========================================================
   VERIFIER SI UN DOMAINE EST CONNU
   POUR BLOQUER LES IFRAMES
========================================================= */

function isKnownIframeBlocked(url){

  const host =
    getRealHostname(url);


  if(!host){

    return false;

  }


  return KNOWN_IFRAME_BLOCKED.some(
    blocked =>

      host === blocked ||
      host.endsWith(
        "." + blocked
      )

  );

}


/* =========================================================
   AFFICHAGE .NEXUS
========================================================= */

function displayUrl(url){

  if(!url){

    return "";

  }


  try{

    const parsed =
      new URL(url);


    let host =
      parsed.hostname;


    if(
      host.startsWith("www.")
    ){

      host =
        host.slice(4);

    }


    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }


    /*
      Remplace le TLD réel :

      .com
      .fr
      .io
      .to
      .net
      .org
      etc.

      par :

      .nexus
    */

    const lastDot =
      host.lastIndexOf(".");


    if(
      lastDot > 0
    ){

      host =
        host.slice(
          0,
          lastDot
        ) +
        ".nexus";

    }else{

      host +=
        ".nexus";

    }


    return (
      host +
      parsed.pathname +
      parsed.search +
      parsed.hash
    );

  }catch{

    return url;

  }

}


/* =========================================================
   NOM DU SITE
========================================================= */

function getSiteName(url){

  try{

    let host =
      new URL(url)
        .hostname
        .replace(/^www\./i,"");


    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }


    return (
      host.charAt(0)
        .toUpperCase() +
      host.slice(1)
    );

  }catch{

    return "Ce site";

  }

}


/* =========================================================
   LABEL ONGLET
========================================================= */

function tabLabel(url){

  if(!url){

    return "Nouvel onglet";

  }


  try{

    let host =
      new URL(url)
        .hostname
        .toLowerCase()
        .replace(/^www\./,"");


    if(
      host.endsWith(".nexus")
    ){

      host =
        host.slice(
          0,
          -6
        );

    }


    const lastDot =
      host.lastIndexOf(".");


    if(
      lastDot > 0
    ){

      host =
        host.slice(
          0,
          lastDot
        ) +
        ".nexus";

    }else{

      host +=
        ".nexus";

    }


    return host;

  }catch{

    return "C.N. Nexus";

  }

}


/* =========================================================
   NORMALISER URL
========================================================= */

function normalize(value){

  value =
    String(value || "")
      .trim();


  if(!value){

    return "";

  }


  /*
    Si l'utilisateur tape un faux domaine
    .nexus, on le transforme en .com
    par défaut pour retrouver une URL réelle.

    Exemple :

    google.nexus
    → google.com
  */

  if(
    !value.includes("://") &&
    /\.nexus(?=[:/?#]|$)/i.test(value)
  ){

    value =
      value.replace(
        /\.nexus(?=[:/?#]|$)/i,
        ".com"
      );

  }


  if(
    value.includes("://")
  ){

    try{

      const parsed =
        new URL(value);


      if(
        parsed.hostname
          .endsWith(".nexus")
      ){

        parsed.hostname =
          parsed.hostname.replace(
            /\.nexus$/i,
            ".com"
          );

      }


      return parsed.toString();

    }catch{

      return value;

    }

  }


  if(
    /^(localhost|[\w-]+(\.[\w-]+)+)(:\d+)?(\/.*)?$/i
      .test(value)
  ){

    return (
      "https://" +
      value
    );

  }


  const engine =
    SEARCH_ENGINES[
      getSearchEngine()
    ] || SEARCH_ENGINES.mojeek;


  return (
    engine.url +
    encodeURIComponent(value)
  );

}


/* =========================================================
   ONGLET ACTIF
========================================================= */

function getActiveTab(){

  return tabs.find(
    t =>
      t.id === activeTab
  );

}


/* =========================================================
   RENDU ONGLETS
========================================================= */

function renderTabs(){

  const container =
    $("tabs");


  container.innerHTML =
    "";


  tabs.forEach(
    t => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "tab" +
        (
          t.id === activeTab
            ? " active"
            : ""
        );


      button.textContent =
        tabLabel(t.url);


      button.title =
        t.url
          ? displayUrl(t.url)
          : "Nouvel onglet";


      button.onclick =
        () => {

          activeTab =
            t.id;

          renderTabs();

          loadCurrent();

        };


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   ACCUEIL
========================================================= */

function showHome(){

  page.innerHTML = `

    <div class="home">

      <div class="home-card">

        <div class="home-logo">
          N
        </div>

        <h1>
          C.N. Nexus
        </h1>

        <p>
          Le navigateur de C.N. Organization
        </p>

        <div class="home-search">

          <input
            id="homeInput"
            type="text"
            placeholder="Rechercher ou entrer une adresse"
            autocomplete="off"
            spellcheck="false"
          >

          <button
            class="primary"
            id="homeGo"
          >
            Explorer
          </button>

        </div>

      </div>

    </div>

  `;


  const input =
    $("homeInput");

  const go =
    $("homeGo");


  function launch(){

    navigate(
      input.value
    );

  }


  go.onclick =
    launch;


  input.addEventListener(
    "keydown",
    event => {

      if(
        event.key === "Enter"
      ){

        launch();

      }

    }
  );

}


/* =========================================================
   PAGE D'ERREUR NEXUS
========================================================= */

function showExternalFallback(url){

  const siteName =
    getSiteName(url);


  page.innerHTML =
    "";


  const overlay =
    document.createElement(
      "div"
    );


  overlay.className =
    "external-fallback";


  const box =
    document.createElement(
      "div"
    );


  box.className =
    "external-fallback-box";


  const title =
    document.createElement(
      "div"
    );


  title.className =
    "external-fallback-title";


  title.textContent =
    siteName +
    " utilise un protocole incompatible avec le système sécurisé Nexus.";


  const text =
    document.createElement(
      "div"
    );


  text.className =
    "external-fallback-text";


  text.textContent =
    "Ouvrir avec votre navigateur par défaut.";


  const urlText =
    document.createElement(
      "div"
    );


  urlText.className =
    "external-fallback-url";


  urlText.textContent =
    displayUrl(url);


  const button =
    document.createElement(
      "button"
    );


  button.className =
    "primary external-fallback-button";


  button.textContent =
    "↗ Ouvrir avec votre navigateur par défaut";


  button.onclick =
    () => {

      const opened =
        window.open(
          url,
          "_blank"
        );


      if(opened){

        setStatus(
          "Ouvert avec le navigateur par défaut — " +
          displayUrl(url)
        );

      }else{

        setStatus(
          "L'ouverture a été bloquée par le navigateur."
        );

      }

    };


  box.append(
    title,
    text,
    urlText,
    button
  );


  overlay.appendChild(
    box
  );


  page.appendChild(
    overlay
  );


  setStatus(
    "Page externe — " +
    displayUrl(url)
  );

}


/* =========================================================
   NAVIGATION
========================================================= */

function navigate(
  value,
  push = true
){

  const url =
    normalize(value);


  if(!url){

    showHome();

    return;

  }


  const t =
    getActiveTab();


  if(!t){

    return;

  }


  t.url =
    url;


  try{

    t.title =
      new URL(url)
        .hostname;

  }catch{

    t.title =
      "C.N. Nexus";

  }


  address.value =
    displayUrl(url);


  renderTabs();


  if(push){

    history =
      history.slice(
        0,
        historyIndex + 1
      );


    history.push(
      url
    );


    historyIndex =
      history.length - 1;

  }


  /*
    IMPORTANT :

    Si le domaine fait partie des sites
    connus pour bloquer les iframes,
    on n'essaie même pas de charger
    l'iframe.

    On affiche directement la page Nexus.
  */

  if(
    isKnownIframeBlocked(url)
  ){

    showExternalFallback(
      url
    );

    updateBookmarkButton();

    return;

  }


  /*
    Pour tous les autres sites,
    on tente réellement l'iframe.
  */

  page.innerHTML =
    "";


  const frame =
    document.createElement(
      "iframe"
    );


  frame.className =
    "browser-frame";


  frame.setAttribute(
    "allowfullscreen",
    ""
  );


  frame.setAttribute(
    "referrerpolicy",
    "no-referrer-when-downgrade"
  );


  frame.src =
    url;


  page.appendChild(
    frame
  );


  setStatus(
    "Chargement — " +
    displayUrl(url)
  );


  /*
    ATTENTION :

    Le load n'est PAS utilisé pour décider
    si le site est compatible.

    Certains sites qui bloquent les iframes
    peuvent quand même déclencher load.

    Il sert uniquement au statut.
  */

  frame.addEventListener(
    "load",
    () => {

      setStatus(
        "Page chargée — " +
        displayUrl(url)
      );

    },
    {
      once:true
    }
  );


  updateBookmarkButton();

}


/* =========================================================
   CHARGER ONGLET
========================================================= */

function loadCurrent(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    page.innerHTML =
      "";


    address.value =
      "";


    showHome();


    setStatus(
      "Prêt"
    );


    updateBookmarkButton();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   NOUVEL ONGLET
========================================================= */

function newTab(){

  const id =
    Date.now();


  tabs.push({

    id:id,

    title:
      "Nouvel onglet",

    url:
      ""

  });


  activeTab =
    id;


  renderTabs();

  loadCurrent();

  address.focus();

}


/* =========================================================
   ACCUEIL
========================================================= */

function goHome(){

  const t =
    getActiveTab();


  if(!t){

    return;

  }


  t.url =
    "";

  t.title =
    "Nouvel onglet";


  renderTabs();

  loadCurrent();

}


/* =========================================================
   RELOAD
========================================================= */

function reload(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    loadCurrent();

    return;

  }


  navigate(
    t.url,
    false
  );

}


/* =========================================================
   BACK
========================================================= */

function goBack(){

  if(
    historyIndex <= 0
  ){

    setStatus(
      "Pas de page précédente"
    );

    return;

  }


  historyIndex--;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FORWARD
========================================================= */

function goForward(){

  if(
    historyIndex >=
    history.length - 1
  ){

    setStatus(
      "Pas de page suivante"
    );

    return;

  }


  historyIndex++;


  const url =
    history[historyIndex];


  const t =
    getActiveTab();


  if(t){

    t.url =
      url;

  }


  navigate(
    url,
    false
  );

}


/* =========================================================
   FAVORIS
========================================================= */

function getBookmarks(){

  try{

    return JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

  }catch{

    return [];

  }

}


function saveBookmarks(
  bookmarks
){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(bookmarks)
  );

}


function renderFavorites(){

  const container =
    $("favorites");


  const bookmarks =
    getBookmarks();


  container.innerHTML =
    "";


  if(
    bookmarks.length === 0
  ){

    const empty =
      document.createElement(
        "div"
      );


    empty.className =
      "empty-favorites";


    empty.textContent =
      "Aucun favori";


    container.appendChild(
      empty
    );


    return;

  }


  bookmarks.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "favorite";


      const icon =
        document.createElement(
          "span"
        );


      icon.textContent =
        "★";


      const name =
        document.createElement(
          "span"
        );


      name.className =
        "favorite-name";


      name.textContent =
        item.title ||
        tabLabel(item.url);


      button.title =
        displayUrl(item.url);


      button.append(
        icon,
        name
      );


      button.onclick =
        () => {

          navigate(
            item.url
          );

        };


      container.appendChild(
        button
      );

    }
  );

}


function toggleBookmark(){

  const t =
    getActiveTab();


  if(
    !t ||
    !t.url
  ){

    setStatus(
      "Aucune page à ajouter aux favoris"
    );

    return;

  }


  const bookmarks =
    getBookmarks();


  const existing =
    bookmarks.findIndex(
      item =>
        item.url === t.url
    );


  if(
    existing !== -1
  ){

    bookmarks.splice(
      existing,
      1
    );


    saveBookmarks(
      bookmarks
    );


    renderFavorites();


    setStatus(
      "Favori supprimé"
    );


    $("bookmark").textContent =
      "☆";


    return;

  }


  bookmarks.push({

    title:
      tabLabel(t.url),

    url:
      t.url

  });


  saveBookmarks(
    bookmarks
  );


  renderFavorites();


  setStatus(
    "Ajouté aux favoris — " +
    displayUrl(t.url)
  );


  $("bookmark").textContent =
    "★";

}


function updateBookmarkButton(){

  const t =
    getActiveTab();


  const button =
    $("bookmark");


  if(
    !t ||
    !t.url
  ){

    button.textContent =
      "☆";

    return;

  }


  const bookmarks =
    getBookmarks();


  const exists =
    bookmarks.some(
      item =>
        item.url === t.url
    );


  button.textContent =
    exists
      ? "★"
      : "☆";

}


/* =========================================================
   C.N. AI
========================================================= */

function aiReply(message){

  const text =
    message
      .toLowerCase()
      .trim();


  if(
    text.includes("iframe")
  ){

    return (
      "Nexus affiche directement une page externe " +
      "si elle peut être intégrée. Certains sites " +
      "refusent volontairement les iframes."
    );

  }


  if(
    text.includes("nexus") ||
    text.includes("url")
  ){

    return (
      "Le .nexus affiché dans la barre est visuel. " +
      "Par exemple google.com devient google.nexus, " +
      "mais Nexus utilise toujours l'adresse réelle."
    );

  }


  if(
    text.includes("barre") ||
    text.includes("rabatt")
  ){

    return (
      "Le bouton ⌃ permet de rabattre toute l'interface " +
      "Nexus pour afficher davantage la page."
    );

  }


  if(
    text.includes("moteur") ||
    text.includes("mojeek")
  ){

    return (
      "Le moteur de recherche de Nexus est Mojeek."
    );

  }


  if(
    text.includes("favori")
  ){

    return (
      "Le bouton ☆ permet d'ajouter la page actuelle aux favoris."
    );

  }


  if(
    text.includes("nouvel onglet")
  ){

    return (
      "Le bouton + permet de créer un nouvel onglet."
    );

  }


  if(
    text.includes("bonjour") ||
    text.includes("salut") ||
    text === "yo"
  ){

    return (
      "Salut 👋 Comment puis-je t'aider avec C.N. Nexus ?"
    );

  }


  return (
    "Je suis C.N. AI. Je peux t'aider avec " +
    "les fonctions de C.N. Nexus."
  );

}


function addAiMessage(
  text,
  type
){

  const container =
    $("aiMessages");


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "ai-message " +
    type;


  message.textContent =
    text;


  container.appendChild(
    message
  );


  container.scrollTop =
    container.scrollHeight;

}


/* =========================================================
   EVENEMENTS
========================================================= */

$("back").onclick =
  goBack;


$("forward").onclick =
  goForward;


$("reload").onclick =
  reload;


$("home").onclick =
  goHome;


$("newTab").onclick =
  newTab;


$("bookmark").onclick =
  toggleBookmark;


/* =========================================================
   BARRE ADRESSE
========================================================= */

address.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter"
    ){

      navigate(
        address.value
      );

    }

  }
);


/* =========================================================
   BOUTON RABATTRE
========================================================= */

$("chromeToggle").onclick =
  () => {

    const collapsed =
      document.body.classList.toggle(
        "chrome-collapsed"
      );


    const button =
      $("chromeToggle");


    if(collapsed){

      button.textContent =
        "⌄";

      button.title =
        "Afficher la barre Nexus";

      button.setAttribute(
        "aria-label",
        "Afficher la barre Nexus"
      );

    }else{

      button.textContent =
        "⌃";

      button.title =
        "Rabattre la barre Nexus";

      button.setAttribute(
        "aria-label",
        "Rabattre la barre Nexus"
      );

    }

  };


/* =========================================================
   AI
========================================================= */

$("aiOpen").onclick =
  () => {

    $("aiPanel")
      .classList
      .toggle("open");

  };


$("aiClose").onclick =
  () => {

    $("aiPanel")
      .classList
      .remove("open");

  };


$("aiForm").addEventListener(
  "submit",
  event => {

    event.preventDefault();


    const input =
      $("aiInput");


    const value =
      input.value.trim();


    if(!value){

      return;

    }


    addAiMessage(
      value,
      "user"
    );


    input.value =
      "";


    setTimeout(
      () => {

        addAiMessage(
          aiReply(value),
          "bot"
        );

      },
      250
    );

  }
);


/* =========================================================
   INITIALISATION
========================================================= */

renderTabs();

renderFavorites();

showHome();

updateBookmarkButton();

setStatus(
  "Prêt"
);

</script>
